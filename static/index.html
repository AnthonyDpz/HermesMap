  const fill = x => x.replaceAll('{racine}', data.root).replaceAll('{nb}', String(items.length)).replaceAll('{fichiers}', list);
  $('#hbody').innerHTML = `
    <div class="mvrows small">${items.slice(0, 12).map(c => `<div class="mvrow">${catOf(c)==='image' && !c.cloud ? `<img src="${isAnimated(c) ? raw(c.path) : thumbUrl(c.path)}" onerror="this.src='${raw(c.path)}';this.onerror=null" alt="">` : `<span class="mvic">${iconFor(c)}</span>`}<div class="mvcol"><span>${esc(c.name)}</span><small class="where">${esc(c.path)}</small></div></div>`).join('')}${items.length > 12 ? `<div class="note">… et ${items.length - 12} autre(s)</div>` : ''}</div>
    <div class="row" style="display:flex;gap:10px;align-items:center"><b class="tgt">Profil Hermes</b>
      <select id="hprof" class="mvin" style="width:auto">${profiles.map(p => `<option ${p===prof?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <span class="note">Choisis un profil qui a le droit d'écrire dans tous les dossiers concernés.</span></div>
    <div class="note">Consigne envoyée à Hermes (modifiable ; <code>{fichiers}</code>, <code>{nb}</code>, <code>{racine}</code> sont remplacés automatiquement).</div>
    <textarea id="hprompt" spellcheck="false"></textarea>
    <div class="note">🛟 Avant de commencer, Hermes Map sauvegarde les index (.md, .yaml, .jsonl) de tous les dossiers suivis et note l'empreinte de chaque fichier. À la fin : où chaque fichier est parti (même renommé), le détail des index modifiés, et un bouton <b>Annuler</b> qui remet tout en place.</div>
    <div class="note">ℹ️ Pour « regarder » une image, le modèle configuré dans ce profil Hermes doit savoir lire les images (vision). Sinon Hermes ne s'appuiera que sur le nom, le dossier et la fiche.</div>`;
  $('#hprompt').value = tpl;
  $('#hfoot').innerHTML = `<button class="tbtn" id="hreset">Consigne par défaut</button><span class="sp"></span><span class="note">Commande : <code>${esc(info.hermes)} -p <span id="hpshow">${esc(prof)}</span> chat --query-file -</code></span><button class="tbtn" id="hcancel">Annuler</button><button class="tbtn primary" id="hgo">☤ Lancer le reclassement</button>`;
  $('#hprof').onchange = () => { $('#hpshow').textContent = $('#hprof').value; };
  $('#hreset').onclick = () => { $('#hprompt').value = def; try { localStorage.removeItem('hm-prompt-reclass' + (HM_LANG === 'en' ? '-en' : '')); } catch(e){} };
  $('#hcancel').onclick = hhide;
  $('#hgo').onclick = async () => {
    const tplNow = $('#hprompt').value, pr = $('#hprof').value;
    try { tplNow !== def ? localStorage.setItem('hm-prompt-reclass' + (HM_LANG === 'en' ? '-en' : ''), tplNow) : localStorage.removeItem('hm-prompt-reclass' + (HM_LANG === 'en' ? '-en' : '')); localStorage.setItem('hm-profile-reclass', pr); } catch(e){}
    $('#hgo').disabled = true;
    const r = await hpost('/api/hermes/run', {mode: 'reclass', files: items.map(c => c.path), prompt: fill(tplNow), profile: pr === 'default' ? '' : pr});
    if (r.error){ $('#hgo').disabled = false; alertBox(r.error); return; }
    hjob = r; hsince = 0; hesince = 0;

  };

async function openApp(path, reveal){

const appButtons = path => `<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="tbtn" data-app="${esc(path)}">Ouvrir avec l'app du Mac</button><button class="tbtn" data-finder="${esc(path)}">Montrer dans le Finder</button></div>`;
function wireAppButtons(el){
  el.querySelectorAll('[data-app]').forEach(b => b.onclick = e => { e.stopPropagation(); openApp(b.dataset.app); });
  el.querySelectorAll('[data-finder]').forEach(b => b.onclick = e => { e.stopPropagation(); openApp(b.dataset.finder, true); });
}
// joue une vidéo dans el ; les formats non lus par le navigateur (AVI, MKV…) sont convertis par ffmpeg sur le Mac
async function playVideo(el, c, opts={}){
  const attrs = `${opts.controls === false ? '' : 'controls'} ${opts.muted ? 'muted' : ''} ${opts.loop ? 'loop' : ''} autoplay playsinline`;
  const fail = msg => { el.innerHTML = `<div class="ph">${msg}${appButtons(c.path)}</div>`; wireAppButtons(el); };
  if (WEBVIDEO_RE.test(c.name || c.path)){
    el.innerHTML = `<video ${attrs} src="${raw(c.path)}"></video>`;
    el.querySelector('video').onerror = () => fail('Le navigateur ne sait pas lire cette vidéo (codec non pris en charge).');
    return;
  }
  const token = (el._vtok = Math.random());
  while (true){
    const st = await (await fetch('/api/video?path=' + encodeURIComponent(c.path))).json();
    if (el._vtok !== token || !el.isConnected) return;
    if (st.state === 'native' || st.state === 'ready'){
      el.innerHTML = `<video ${attrs} src="/api/video/file?path=${encodeURIComponent(c.path)}"></video>`;
      el.querySelector('video').onerror = () => fail('Lecture impossible.');
      return;
    }
    if (st.state === 'no-ffmpeg') return fail(`Ce format (${extOf(c)}) n'est pas lu par les navigateurs.<br><small>Pour le lire ici, installe ffmpeg une fois (Terminal : <code>brew install ffmpeg</code>), puis relance Hermes Map.</small>`);
    if (st.state === 'error') return fail(T('Conversion impossible : {0}', esc(st.error || '')));
    el.innerHTML = `<div class="ph">⏳ Conversion de la vidéo pour le navigateur… ${Math.round((st.progress||0)*100)} %<br><small>(une seule fois : elle est gardée en cache)</small></div>`;
    await sleep(1000);
  }
}
// affiche un document dans el : PDF, texte, Markdown, Word… ou un aperçu + bouton « Ouvrir avec l'app »
async function renderDocInto(el, c){
  const name = c.name || c.path.split('/').pop();
  if (/\.pdf$/i.test(name)){ el.innerHTML = `<iframe class="docframe" src="${raw(c.path)}"></iframe>`; return; }
  el.innerHTML = '<div class="ph">Chargement…</div>';
  if (/\.(docx?|rtfd?|odt)$/i.test(name)){
    const d = await (await fetch('/api/doc?path=' + encodeURIComponent(c.path))).json();
    if (d.html){ el.innerHTML = `<div class="docpaper">${DOMPurify.sanitize(d.html, {WHOLE_DOCUMENT: false, FORBID_TAGS: ['style']})}</div>`; return; }
  }
  if (/\.(txt|md|markdown|json|jsonl|ya?ml|csv|log|ini|cfg|conf|toml|xml|html?)$/i.test(name)){
    const info = await (await fetch('/api/node?path=' + encodeURIComponent(c.path))).json();
    if (info.text != null){
      el.innerHTML = `<div class="doctext">${renderText(info)}</div>`;
      el.querySelectorAll('.md[data-base]').forEach(md => md.querySelectorAll('img').forEach(img => { const s = img.getAttribute('src')||''; if (!/^(https?:|data:)/.test(s)){ const t = resolveRel(md.dataset.base, decodeURIComponent(s)); if (t !== null) img.src = raw(t); } }));
      return;
    }
  }
  // Excel, PowerPoint, Pages, Numbers, Keynote… : aperçu Quick Look + ouverture dans l'app du Mac
  el.innerHTML = `<div class="ph"><img class="docthumb" src="${thumbUrl(c.path)}" onerror="this.remove()" alt=""><br>Aperçu de la 1re page. Ce format ne s'affiche pas en entier dans le navigateur.${appButtons(c.path)}</div>`;
  wireAppButtons(el);
}

function stopLbMedia(){ $('#lightbox .stage').querySelectorAll('video,audio').forEach(m => { m.pause(); m.removeAttribute('src'); m.load(); }); }

function openLightbox(i){
  if (!lbList.length) return;

  const c = lbList[lbIndex], cat = catOf(c), lb = $('#lightbox'), stage = lb.querySelector('.stage');

  else {
    stage.innerHTML = cat==='audio' ? `<audio controls autoplay src="${url}"></audio>` : `<img src="${url}" alt="">`;

    m.onerror = () => { stage.innerHTML = `<div class="ph">Impossible d'afficher ce fichier dans le navigateur.${appButtons(c.path)}</div>`; wireAppButtons(stage); };

// ---------------- Recherche (barre du haut) : tout l'arbre, pas seulement la carte ----------------
let resIdx = 0, resList = [], topSeq = 0, topTimer = null;
function showResults(q, items, footer){
  const box = $('#results');
  resList = items; resIdx = 0;
  box.innerHTML = (items.length ? items.map((r,i) =>
      `<div class="${i===0?'sel':''}" data-i="${i}">${iconFor(byId.get(r.path) || r)} <span>${hlText(r.name, q)}</span><small>${esc(r.where ?? '')}${r.match==='chemin' ? ' · dans un dossier correspondant' : ''}</small></div>`).join('')
    : `<div style="color:var(--muted)">${footer ? 'Recherche…' : 'Aucun résultat'}</div>`)
    + (footer ? `<div class="all" data-all="1">${footer}</div>` : '');
  box.style.display='block';
  box.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => pick(resList[+d.dataset.i]));
  box.querySelector('[data-all]') && (box.querySelector('[data-all]').onclick = () => searchInPanel(q));
}
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim();
  if (!q){ $('#results').style.display='none'; return; }
  // 1) tout de suite : ce qui est sur la carte (et les tags)
  const nq = normTxt(q);
  const local = data.nodes.filter(n => n.kind!=='more' && n.kind!=='root' && normTxt(n.name).includes(nq))
    .sort((a,b) => (a.kind==='tag'?0:1)-(b.kind==='tag'?0:1) || (a.kind==='dir'?0:1)-(b.kind==='dir'?0:1))
    .slice(0, 15).map(n => ({path: n.id, name: n.name, kind: n.kind, where: n.kind==='tag' ? 'tag' : (n.path||'').split('/').slice(0,-1).join('/')}));
  showResults(q, local, 'Recherche dans tous les sous-dossiers…');
  // 2) puis l'index complet côté serveur
  clearTimeout(topTimer);
  const my = ++topSeq;
  topTimer = setTimeout(async () => {
    const r = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=60`)).json();
    if (my !== topSeq) return;
    if (r.pending){ showResults(q, local, 'Indexation en cours, réessaie dans un instant…'); return; }
    const seen = new Set(local.map(x => x.path));
    const merged = local.filter(x => x.kind==='tag').concat((r.results||[]).filter(x => !seen.has(x.path) || true)).filter((x,i,arr) => arr.findIndex(y => y.path===x.path)===i).slice(0, 60);
    showResults(q, merged, r.total ? `▸ Voir les ${r.total} résultat(s) dans le panneau (avec filtres, galerie, contenu…)` : '');
  }, 200);
});
$('#q').addEventListener('keydown', e => {
  const box = $('#results');
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); resIdx = Math.max(0, Math.min(resList.length-1, resIdx + (e.key==='ArrowDown'?1:-1)));
    box.querySelectorAll('div[data-i]').forEach((d,i)=>d.classList.toggle('sel', i===resIdx)); box.querySelectorAll('div[data-i]')[resIdx]?.scrollIntoView({block:'nearest'}); }
  if (e.key==='Enter'){ if (e.metaKey || e.ctrlKey || !resList.length) searchInPanel($('#q').value.trim()); else pick(resList[resIdx]); }
  if (e.key==='Escape'){ $('#q').blur(); box.style.display='none'; }
});
// ouvre le panneau sur la racine avec la recherche récursive déjà remplie
function searchInPanel(q){
  $('#results').style.display='none'; $('#q').blur();

}
// sélectionne un résultat : s'il est sur la carte on y va, sinon on met en évidence son dossier visible le plus proche
function pick(r){
  if (!r) return;
  $('#results').style.display='none'; $('#q').blur();
  const id = r.path;
  let n = byId.get(id);
  if (n){
    if (hiddenGroups.has(n.group)){ hiddenGroups.delete(n.group); buildLegend(); }
    if (n.kind==='tag' && !showTags){ showTags = true; $('#tTags').classList.add('on'); }
    if (!showFiles && n.kind!=='dir' && n.kind!=='tag'){ showFiles=true; $('#tFiles').classList.add('on'); }
    render(); return setTimeout(()=>selectNode(id, true), 50);
  }
  let anc = id;
  while (anc && !byId.has(anc)) anc = anc.split('/').slice(0,-1).join('/');
  if (anc){ selected = anc; highlight(anc); focusNode(anc); }
  if (r.kind!=='dir' && ['image','video','audio'].includes(catOf(r))){ lbList = [r]; openLightbox(0); }
  openPanel(r.kind==='dir' ? id : (id.split('/').slice(0,-1).join('/')), {restore: {dir: {q: r.kind==='dir' ? '' : r.name, deep: false}}});
}

    <section id="sArchSec">
      <h2><span class="n">3</span>Voulez-vous centraliser les fichiers et binaires dans un dossier d'archivage ?</h2>
      <label class="opt" data-a="0"><input type="radio" name="sArch" value="0"><span class="t"><b>Non, tout reste où c'est</b><span class="hint">Les images, vidéos, PDF… restent à côté des notes. Rien n'est réorganisé.</span></span></label>
      <label class="opt" data-a="1"><input type="radio" name="sArch" value="1"><span class="t"><b>Oui, centraliser dans un dossier d'archivage</b><span class="hint" id="sArchHint"></span></span></label>
      <div class="row" id="sArchRow" style="display:none"><span class="hint">Dossier de stockage miroir :</span><select id="sArchSel"></select><input type="text" id="sArchName" style="width:200px;display:none" placeholder="nom du nouveau dossier"><span class="hint" id="sArchState"></span></div>
    </section>
    ${H.command ? `<section>
      <h2><span class="n">4</span>Profil Hermes</h2>
      <div class="row"><span class="hint">Profil utilisé par défaut :</span><select id="sProf">${['', ...(H.profiles||[])].map(p => `<option value="${esc(p)}" ${p === (h0.profile||'') ? 'selected' : ''}>${p ? esc(p) : 'profil par défaut de Hermes'}</option>`).join('')}</select></div>
      <div class="row"><span class="hint">Pour reclasser des fichiers (doit pouvoir écrire partout) :</span><select id="sRProf">${['', ...(H.profiles||[])].map(p => `<option value="${esc(p)}" ${p === (h0.reclass_profile||'') ? 'selected' : ''}>${p ? esc(p) : 'le même'}</option>`).join('')}</select></div>
      <p class="hint">Si un profil porte le nom d'un dossier (ex. profil <code>pro</code> pour le dossier <code>Pro</code>), il est proposé automatiquement quand tu travailles dans ce dossier.</p>
    </section>` : ''}
    <details ${first ? '' : 'open'}><summary>Réglages avancés</summary><div class="grid">
      <span>Préfixe masqué dans les noms</span><input type="text" id="sPrefix" value="${esc(cur.zone_prefix || '')}" placeholder="facultatif, ex. N_ : N_Pro s'affiche « Pro »">
      <span>Nom affiché au centre</span><input type="text" id="sTitle" value="${esc(cur.title || '')}" placeholder="nom du dossier">
      <span>Dossiers ignorés</span><input type="text" id="sIgnore" value="${esc((cur.ignore||[]).join(', '))}" placeholder="ex. _corbeille, Sauvegardes">
      ${H.command ? `<span>Règles à suivre par Hermes</span><input type="text" id="sConv" value="${esc((h0.conventions||[]).join(', '))}" placeholder="fichiers .md de conventions, ex. Accueil/CONVENTIONS.md">
      <span>Dossier de travail (reclassement)</span><input type="text" id="sWork" value="${esc(h0.workdir||'')}" placeholder="dossier principal (défaut)">
      <span>Non sauvegardés avant reclassement</span><input type="text" id="sBSkip" value="${esc((h0.backup_skip||[]).join(', '))}" placeholder="ex. _gros_dossier">` : ''}
      <span>Fichier de réglages</span><code>${esc(cur.config_file || '')}</code>
    </div></details>
    <p class="hint sponsor">Hermes Map est gratuit et open source. S'il t'est utile, tu peux <a href="https://github.com/sponsors/AnthonyDpz" target="_blank" rel="noopener noreferrer">☕ soutenir le projet</a>.</p>
    <div class="foot"><span class="hint" id="sMsg"></span>${first ? '' : '<button class="tbtn" id="sCancel">Annuler</button>'}<button class="tbtn primary" id="sGo">${first ? 'C\'est parti →' : 'Enregistrer'}</button></div>
  </div>`;

  const renderCands = () => {
    $('#sCands').innerHTML = cands.map((c, i) => `<label class="opt ${c.path === sel ? 'on' : ''}" data-i="${i}"><input type="radio" name="sCand" ${c.path === sel ? 'checked' : ''}>
      <span class="t"><b>${esc(c.label || c.name)}${c.access === 'denied' ? '<span class="badge bad">accès à autoriser</span>' : c.access === 'missing' ? '<span class="badge bad">introuvable</span>' : c.dirs != null ? `<span class="badge">${c.dirs} dossier(s)</span>` : ''}${c.obsidian ? '<span class="badge ok">Obsidian</span>' : ''}</b><small>${esc(c.path)}</small></span></label>`).join('');
    document.querySelectorAll('#sCands .opt').forEach(o => o.onclick = e => { e.preventDefault(); pick(cands[+o.dataset.i].path); });
  };
  const archName = () => { const v = $('#sArchSel').value; return (v === '__new' ? $('#sArchName').value : v || '').trim().replace(/^\/+|\/+$/g, '') || 'Archive'; };
  const archOn = () => document.querySelector('input[name=sArch][value="1"]').checked;
  const archMode = v => {
    document.querySelectorAll('#sArchSec .opt').forEach(o => { const on = o.dataset.a === v; o.classList.toggle('on', on); o.querySelector('input').checked = on; });
    $('#sArchRow').style.display = v === '1' ? 'flex' : 'none';
    updArchHint(); markTops();
  };
  const pre = () => ($('#sPrefix').value || '').trim();
  const updArchHint = () => {
    const name = archName();
    const checked = [...document.querySelectorAll('#sTops input[data-t]:checked')].map(i => i.dataset.t).filter(t => t !== name);
    const top = checked[0] || (chosen && (chosen.all||[]).find(t => t !== name)) || (HM_LANG === 'en' ? 'Trips' : 'Voyages');
    const p = pre(), zone = (p && top.startsWith(p) ? top.slice(p.length) : top).toLowerCase();
    $('#sArchHint').innerHTML = `Les notes restent dans leurs dossiers ; les fichiers (images, vidéos, PDF, documents…) vont dans le dossier de stockage, au même chemin : la note <code>${esc(top)}/${HM_LANG === 'en' ? 'japan' : 'japon'}.md</code> et ses photos dans <code>${esc(name)}/${esc(zone)}/</code>. La carte montre les deux ensemble, et le reclassement (à la main ou par Hermes) suit cette règle. Rien n'est déplacé tout de suite.`;
    const exists = chosen && (chosen.all||[]).includes(name);
    $('#sArchName').style.display = $('#sArchSel').value === '__new' ? '' : 'none';
    $('#sArchState').innerHTML = !chosen ? '' : exists ? '<span class="ok">✓ dossier existant (rien n\'y sera ajouté)</span>' : 'sera créé (avec un README, un catalogue et un journal)';
  };
  // le dossier de stockage n'est pas un dossier de notes : on le signale dans la liste
  const markTops = () => {
    const a = archOn() ? archName() : null;
    document.querySelectorAll('#sTops label[data-l]').forEach(l => {
      const inp = l.querySelector('input'), isA = l.dataset.l === a;
      l.classList.toggle('arch', isA); inp.disabled = isA;
      l.querySelector('span').textContent = (isA ? '🗄 ' : '') + l.dataset.l;
      l.classList.toggle('on', inp.checked && !isA);
    });
    const n = document.querySelectorAll('#sTops input[data-t]:checked:not(:disabled)').length;
    if ($('#sCount')) $('#sCount').textContent = `${n} dossier(s) de notes`;
  };
  const globOk = (name, inc) => !inc || inc === '*' || inc.split(',').map(x => x.trim()).filter(Boolean)
    .some(p => new RegExp('^' + p.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$').test(name));
  const showTops = () => {
    const c = chosen;
    if (!c){ $('#sTops').innerHTML = ''; return; }
    if (c.access === 'denied'){ $('#sTops').innerHTML = deniedBox(c.path); bindDenied(); return; }
    if (c.access !== 'ok'){ $('#sTops').innerHTML = `<p class="hint" style="color:var(--danger)">Dossier introuvable.</p>`; return; }
    const all = c.all || [];
    const same = cur.root === c.path;
    let isOn, autoNew;
    if (same){
      const f = cur.folders || [], hid = cur.hidden_tops || [];
      isOn = t => f.length ? f.includes(t) : (!hid.includes(t) && globOk(t, cur.include));
      autoNew = !f.length && (!cur.include || cur.include === '*');
    } else {
      const sp = (c.suggest || {}).zone_prefix || '';
      isOn = t => !sp || t.startsWith(sp);
      autoNew = !sp;
      if (!$('#sPrefix').value) $('#sPrefix').value = sp;
    }
    $('#sTops').innerHTML = all.length ? `<p class="hint" style="margin-top:6px"><b>Quels dossiers contiennent tes notes ?</b> Coche ceux à afficher sur la carte (le côté « notes »).</p>
      <div class="row"><button class="tbtn" id="sAll">Tout cocher</button><button class="tbtn" id="sNone">Tout décocher</button><span class="hint" id="sCount"></span></div>
      <div class="tops">${all.map(t => `<label data-l="${esc(t)}"><input type="checkbox" data-t="${esc(t)}" ${isOn(t) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>
      <label class="row hint" style="cursor:pointer"><input type="checkbox" id="sAutoNew" ${autoNew ? 'checked' : ''}> Afficher aussi les dossiers créés plus tard</label>`
      : `<p class="hint">Ce dossier ne contient pas de sous-dossier : ses fichiers seront affichés directement.</p>`;
    const count = () => { const n = document.querySelectorAll('#sTops input[data-t]:checked:not(:disabled)').length; if ($('#sCount')) $('#sCount').textContent = `${n} dossier(s) de notes`; };
    document.querySelectorAll('#sTops input[data-t]').forEach(i => i.onchange = () => { markTops(); count(); updArchHint(); });
    if ($('#sAll')) { $('#sAll').onclick = () => { document.querySelectorAll('#sTops input[data-t]').forEach(i => i.checked = true); markTops(); count(); };
      $('#sNone').onclick = () => { document.querySelectorAll('#sTops input[data-t]').forEach(i => i.checked = false); markTops(); count(); }; }
    // dossier de stockage miroir : un dossier existant, ou un nouveau
    const found = same ? (arch0.folder || c.archive_found) : c.archive_found;
    const newName = (same && arch0.folder && !all.includes(arch0.folder)) ? arch0.folder : (c.archive_default || 'Archive');
    $('#sArchSel').innerHTML = `<option value="__new">➕ Nouveau dossier…</option>` + all.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    $('#sArchSel').value = found && all.includes(found) ? found : '__new';
    $('#sArchName').value = newName;
    archMode(same ? (arch0.enabled ? '1' : '0') : (c.archive_found ? '1' : '0'));
    count();
  };
  const pick = async path => {
    sel = path; renderCands(); $('#sPath').value = '';
    $('#sTops').innerHTML = '<p class="hint">Analyse…</p>';
    chosen = await (await fetch('/api/setup/inspect?path=' + encodeURIComponent(path))).json();
    showTops();
  };
  const deniedBox = path => `<div class="warn"><b>macOS bloque l'accès à ce dossier</b> (<code>${esc(path)}</code>). À faire une seule fois :
    <ol><li>Clique sur <b>Ouvrir les Réglages</b> : la page <b>Accès complet au disque</b> s'ouvre et Hermes Map est montrée dans le Finder.</li>
    <li>Si Hermes Map est déjà dans la liste, sélectionne-la et retire-la (bouton −). Puis glisse Hermes Map dans la liste (ou bouton +) et active-la.</li>
    <li>Quitte Hermes Map (⏻) et relance-la.</li></ol>
    <div class="row" style="margin-top:8px"><button class="tbtn" data-priv="1">Ouvrir les Réglages</button><button class="tbtn" data-retry="1">Réessayer</button></div></div>`;
  const bindDenied = () => {
    document.querySelectorAll('[data-priv]').forEach(b => b.onclick = () => hpost('/api/os/privacy', {}));
    document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => pick(sel));
  };
  if (state.reason === 'denied'){ $('#sDenied').innerHTML = deniedBox(state.path || cur.root || ''); bindDenied(); }
  else if (state.reason === 'missing') $('#sDenied').innerHTML = `<div class="warn">Le dossier <code>${esc(state.path||'')}</code> est introuvable (renommé, déplacé ?). Choisis-le à nouveau.</div>`;

  document.querySelectorAll('#sArchSec .opt').forEach(o => o.onclick = e => { e.preventDefault(); archMode(o.dataset.a); });
  $('#sArchName').oninput = () => { updArchHint(); markTops(); };
  $('#sArchSel').onchange = () => { updArchHint(); markTops(); };
  $('#sPrefix').oninput = updArchHint;
  if ($('#sChoose')) $('#sChoose').onclick = async () => {
    $('#sMsg').textContent = 'La fenêtre de choix peut s\'ouvrir derrière le navigateur…';
    const r = await hpost('/api/setup/choose', {});
    $('#sMsg').textContent = r.error || '';
    if (r.path){ if (!cands.some(c => c.path === r.path)) cands.push({path: r.path, label: r.path.split('/').pop() || r.path, name: r.path}); pick(r.path); }
  };
  let tp; $('#sPath').oninput = () => { clearTimeout(tp); tp = setTimeout(() => { const v = $('#sPath').value.trim(); if (v.startsWith('/') || v.startsWith('~')){ if (!cands.some(c => c.path === v)) cands.push({path: v, label: v.split('/').filter(Boolean).pop() || v, name: v}); pick(v); $('#sPath').value = v; } }, 500); };
  if ($('#sCancel')) $('#sCancel').onclick = () => el.remove();
  const list = v => (v || '').split(',').map(x => x.trim()).filter(Boolean);
  $('#sGo').onclick = async () => {
    if (!chosen || chosen.access !== 'ok'){ $('#sMsg').textContent = 'Choisis d\'abord un dossier accessible.'; return; }
    const a = archOn() ? archName() : null;
    const boxes = [...document.querySelectorAll('#sTops input[data-t]')].filter(i => i.dataset.t !== a);
    const on = boxes.filter(i => i.checked).map(i => i.dataset.t), off = boxes.filter(i => !i.checked).map(i => i.dataset.t);
    if (boxes.length && !on.length){ $('#sMsg').textContent = 'Coche au moins un dossier de notes.'; return; }
    const autoNew = !$('#sAutoNew') || $('#sAutoNew').checked;
    const body = {root: chosen.path, include: '*', folders: autoNew ? [] : on, hidden_tops: autoNew ? off : [],
      zone_prefix: pre(), title: $('#sTitle').value.trim(), ignore: list($('#sIgnore').value),
      archive: {enabled: !!a, folder: a || archName()}};
    if (H.command) body.hermes = {profile: $('#sProf').value, reclass_profile: $('#sRProf').value, conventions: list($('#sConv').value), workdir: $('#sWork').value.trim(), backup_skip: list($('#sBSkip').value)};
    $('#sGo').disabled = true; $('#sMsg').textContent = 'Enregistrement…';
    const r = await hpost('/api/setup/save', body);
    $('#sGo').disabled = false;
    if (r.error === 'denied'){ $('#sMsg').textContent = ''; $('#sDenied').innerHTML = deniedBox(r.path); bindDenied(); el.scrollTop = 0; return; }
    if (r.error){ $('#sMsg').textContent = '⚠️ ' + r.error; return; }
    $('#sMsg').textContent = r.made && r.made.length ? T('Créé : {0}', r.made.join(', ')) : 'C\'est enregistré.';
    setTimeout(() => location.reload(), r.made && r.made.length ? 1200 : 300);
  };
  renderCands();
  $('#sLang').onclick = () => setLang(HM_LANG === 'en' ? 'fr' : 'en');
  if (sel) pick(sel);
}
$('#tSettings').onclick = () => showSetup({});
// langue : l'interrupteur enregistre le choix (réglages) et recharge la page
const setLang = async lg => { if (lg === HM_LANG) return; try { await hpost('/api/lang', {lang: lg}); } catch(e){} location.reload(); };
$('#tLang').classList.add(HM_LANG);
$('#tLang').onclick = () => setLang(HM_LANG === 'en' ? 'fr' : 'en');
if ('__HM_LANG__' !== 'fr' && '__HM_LANG__' !== 'en') hpost('/api/lang', {lang: HM_LANG}).catch(() => {});

load();
// battement de cœur : tant qu'une page est ouverte, l'app reste allumée (elle s'éteint seule ensuite)
setInterval(() => fetch('/api/ping').catch(()=>{}), 20000); fetch('/api/ping').catch(()=>{});
})();
</script>
</body>
</html>
