<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Map</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#12151d; --bg3:#1a1e29; --line:#262b38; --text:#e6e8ee; --muted:#8b92a5;
  --accent:#f5b84b; --accent2:#7cc4ff; --danger:#ff7a7a; --panel-w:44vw;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg2);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .glyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#f5b84b,#e66b3d);color:#1b1206;font-size:15px}
.brand small{color:var(--muted);font-weight:400;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1;max-width:460px;margin-left:12px}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 32px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
#results{position:absolute;top:42px;left:0;min-width:min(560px,90vw);background:var(--bg2);border:1px solid var(--line);border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#results div{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#results div > span{flex:none;max-width:60%}
#results div:hover,#results div.sel{background:var(--bg3)}
#results .all{color:var(--accent);border-top:1px solid var(--line);font-size:13px}
#results mark{background:rgba(245,184,75,.35);color:inherit}
#results small{color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.tbtn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:13px}
.tbtn:hover{border-color:#3a4152}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
main{position:relative;display:flex;min-height:0}
#graphWrap{position:relative;flex:1;min-width:0}
#graph,#graph3d{position:absolute;inset:0}
#labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels3d .l3{position:absolute;transform:translate(-50%,10px);font-size:12px;color:#e6e8ee;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap;font-weight:600}
#labels3d .l3.root{font-size:16px;color:#f5b84b}
#labels3d .l3.tag{color:#ffc1d6;font-weight:500}
#legend{max-height:calc(100% - 24px);overflow:auto}
#legend .lcol{position:absolute;top:6px;right:6px;padding:1px 7px;font-size:11px}
#legend.collapsed{width:auto!important;padding:4px}
#legend.collapsed > :not(.lcol){display:none}
#legend.collapsed .lcol{position:static}
#legend .hint{font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;margin-left:4px}
#legend .lbl{flex:1}
#legend .eye{color:var(--muted);padding:0 2px;font-size:12px}
#legend .eye:hover{color:var(--text)}
#legend input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;margin:0 0 6px;outline:none}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px}
.tagchip{font-size:11.5px;padding:2px 8px;border-radius:12px;background:rgba(255,111,160,.1);border:1px solid rgba(255,111,160,.35);color:#ffc1d6;cursor:pointer}
.tagchip:hover,.tagchip.on{background:rgba(255,111,160,.3);border-color:#ff6fa0}
.tagchip small{color:#c98aa3;margin-left:4px}
.tagchip.auto{background:rgba(124,196,255,.08);border-color:rgba(124,196,255,.35);color:#cfe7ff}
.tagchip.auto small{color:#8fb3d1}
.tagchip.auto:hover,.tagchip.auto.on{background:rgba(124,196,255,.25);border-color:#7cc4ff}
.tagchip.zone{background:color-mix(in srgb,var(--zc) 14%,transparent);border-color:color-mix(in srgb,var(--zc) 55%,transparent);color:var(--zc)}
.tagchip.zone small{color:inherit;opacity:.7}
.tagchip.zone:hover,.tagchip.zone.on{background:color-mix(in srgb,var(--zc) 32%,transparent);border-color:var(--zc)}
.tgtitle{font-size:10.5px;color:var(--muted);margin:6px 2px 4px}
.ntags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
#legend{position:absolute;left:12px;bottom:12px;width:250px;background:rgba(18,21,29,.88);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;max-width:260px;backdrop-filter:blur(6px)}
#legend .row{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:5px;cursor:pointer}
#legend .row:hover{background:var(--bg3)}
#legend .row.off{opacity:.35}
#legend .dot{width:10px;height:10px;border-radius:50%}
#legend .count{margin-left:auto;color:var(--muted)}
#legend h4{margin:2px 4px 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#stats{position:absolute;right:12px;bottom:12px;font-size:11.5px;color:var(--muted);background:rgba(18,21,29,.8);padding:5px 9px;border-radius:7px;border:1px solid var(--line)}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(18,21,29,.85);padding:6px 12px;border-radius:20px;border:1px solid var(--line);pointer-events:none;transition:opacity .6s}
#live{position:absolute;right:12px;top:12px;width:300px;background:rgba(18,21,29,.92);border:1px solid rgba(245,184,75,.35);border-radius:12px;padding:10px 12px;font-size:12.5px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:4}
#live .lh{display:flex;align-items:center;gap:7px}
#live .lh label{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer}
#live .lh .tbtn{padding:2px 7px;font-size:11.5px}
#live .dot{width:9px;height:9px;border-radius:50%;background:#5c6372}
#live .dot.on{background:var(--accent);box-shadow:0 0 0 0 rgba(245,184,75,.7);animation:ping 1.3s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(245,184,75,0)}100%{box-shadow:0 0 0 0 rgba(245,184,75,0)}}
#live .muted{color:var(--muted)}
#live .lc{display:flex;gap:12px;margin:8px 0 6px;font-size:12px}
#live .lf{display:flex;flex-direction:column;gap:1px;max-height:240px;overflow:auto}
#live .li{display:flex;gap:7px;align-items:baseline;padding:3px 4px;border-radius:6px;cursor:pointer}
#live .li:hover{background:var(--bg3)}
#live .li .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#live .li small{color:var(--muted);font-size:11px;white-space:nowrap}
#resizer{width:6px;cursor:col-resize;background:transparent;border-left:1px solid var(--line);flex:none}
#resizer:hover{background:rgba(245,184,75,.25)}
#panel{width:var(--panel-w);min-width:300px;max-width:80vw;flex:none;background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#panel.hidden,#resizer.hidden{display:none}
.phead{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.crumbs{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none;padding:1px 3px;border-radius:4px}
.crumbs a:hover{color:var(--text);background:var(--bg3)}
.ptitle{display:flex;align-items:center;gap:10px;margin-top:6px}
.ptitle h2{font-size:19px;margin:0;font-weight:650;word-break:break-word}
.ptitle .hbtn{margin-left:auto;border-color:rgba(245,184,75,.45);color:var(--accent);font-size:12.5px}
.ptitle .hbtn:hover{background:rgba(245,184,75,.12)}
.ptitle .hbtn.busy{animation:pulse 1.4s infinite}
@keyframes pulse{50%{background:rgba(245,184,75,.2)}}
#hmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60}
#hmodal .box{width:min(860px,94vw);max-height:90vh;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#hmodal .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#hmodal .hd h3{margin:0;font-size:16px}
#hmodal .hd .x{margin-left:auto}
#hmodal .bd{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#hmodal .ft{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#hmodal .ft .sp{flex:1}
#hmodal textarea{width:100%;min-height:300px;background:#0e1118;border:1px solid var(--line);border-radius:8px;color:var(--text);font:12.5px/1.5 var(--mono);padding:10px;resize:vertical;outline:none}
#hmodal textarea:focus{border-color:var(--accent)}
#hmodal .tgt{font-size:13px;line-height:1.5}
#hmodal .tgt code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:1px 6px;border-radius:4px;word-break:break-all}
#hmodal .note{font-size:12px;color:var(--muted)}
#hmodal .warn{font-size:12.5px;color:var(--accent);background:rgba(245,184,75,.08);border:1px solid rgba(245,184,75,.3);border-radius:8px;padding:8px 10px}
#hmodal .tbtn.primary{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:600}
#hmodal .tbtn.danger{border-color:rgba(255,122,122,.5);color:var(--danger)}
#hlog{background:#07090d;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;height:42vh;overflow:auto;margin:0;color:#c8ccd6}
#hlog .me{color:var(--accent)}
.hstate{font-size:12.5px;padding:2px 9px;border-radius:12px;border:1px solid var(--line)}
.hstate.running{color:var(--accent);border-color:rgba(245,184,75,.5)}
.hstate.done{color:#5fd3a6;border-color:rgba(95,211,166,.5)}
.hstate.error,.hstate.stopped{color:var(--danger);border-color:rgba(255,122,122,.5)}
.hchanges .item{font-size:13px}
.hchanges .tagk{font-size:11px;border-radius:10px;padding:0 7px;margin-right:6px;border:1px solid}
.hchanges .k-mod{color:var(--accent2);border-color:rgba(124,196,255,.5)}
.hchanges .k-new{color:#5fd3a6;border-color:rgba(95,211,166,.5)}
.hchanges .k-del{color:var(--danger);border-color:rgba(255,122,122,.5)}
.hchanges .k-oth{color:var(--muted);border-color:var(--line)}
pre.hdiff{background:#07090d;border:1px solid var(--line);border-radius:8px;padding:8px 0;font:12px/1.45 var(--mono);overflow:auto;max-height:46vh;margin:0}
pre.hdiff span{display:block;padding:0 12px;white-space:pre-wrap;word-break:break-word}
pre.hdiff .a{background:rgba(95,211,166,.12);color:#9be8c8}
pre.hdiff .r{background:rgba(255,122,122,.12);color:#ffb0b0}
pre.hdiff .h{color:var(--accent2)}
.ptitle .close{margin-left:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;color:var(--muted);background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.chip.warn{color:var(--accent);border-color:rgba(245,184,75,.4)}
.pbody{flex:1;overflow:auto;padding:16px 20px 40px}
.section{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600}
.md{line-height:1.6;font-size:14.5px}
.md h1,.md h2,.md h3{line-height:1.25;margin:1.2em 0 .5em}
.md h1{font-size:1.5em}.md h2{font-size:1.25em;border-bottom:1px solid var(--line);padding-bottom:4px}.md h3{font-size:1.08em}
.md a{color:var(--accent2)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--bg3);padding:1px 5px;border-radius:4px}
.md pre{background:#0e1118;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--accent);margin:0;padding:2px 14px;color:#c4c9d6}
.md table{border-collapse:collapse;display:block;overflow:auto}
.md td,.md th{border:1px solid var(--line);padding:5px 9px}
.md img{max-width:100%;border-radius:6px}
.md .wl{color:var(--accent);cursor:pointer;border-bottom:1px dashed rgba(245,184,75,.5)}
.fm{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.fm td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.fm td:first-child{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;width:1%}
pre.code{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:#0e1118;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.item:hover{background:var(--bg3)}
.item .ic{width:20px;text-align:center}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sz{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,140px),1fr));gap:8px}
.gallery figure{margin:0;background:var(--bg3);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative}
.gallery figure:hover{border-color:var(--accent)}
.gallery .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0e1118}
.gallery .ph{width:100%;aspect-ratio:4/3;display:grid;place-items:center;font-size:30px;color:var(--muted);background:#0e1118}
.gallery .badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:1px 7px;font-size:11px;pointer-events:none}
.gallery .play{position:absolute;top:calc(37.5% - 20px);left:calc(50% - 20px);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:16px;pointer-events:none;transition:opacity .2s}
.gallery figure.previewing .play{opacity:0}
.gallery video.thumb{pointer-events:none}
.gallery figcaption{font-size:11px;padding:4px 6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px}
.gallery figcaption span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
.filters{position:sticky;top:-16px;z-index:3;background:var(--bg2);margin:-16px -20px 10px;padding:12px 20px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.filters .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters input{flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
.filters input:focus{border-color:var(--accent)}
.filters select{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.fchip{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
.fchip.on{border-color:var(--accent);color:var(--accent)}
.fchip small{color:var(--muted);margin-left:3px}
.fcount{font-size:12px;color:var(--muted);margin-left:auto}
.filters .mirror{font-size:12px;color:var(--muted);gap:10px;background:rgba(124,196,255,.06);border:1px solid rgba(124,196,255,.25);border-radius:8px;padding:6px 9px}
.filters .mirror label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--text)}
.filters .mirror input{flex:none;min-width:0;accent-color:var(--accent2)}
.filters .mlink{color:var(--accent2);cursor:pointer;font-family:var(--mono);font-size:11.5px}
.filters .mlink:hover{text-decoration:underline}
.tbtn.mini{padding:2px 8px;font-size:11px;text-transform:none;letter-spacing:0}
.gallery .badge.arch{left:auto;right:6px}
.gallery .badge.gifb{top:auto;bottom:30px;left:6px;font-size:10px}
.filters .opts{font-size:12px;color:var(--muted);gap:14px}
.filters .opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.filters .opts input{flex:none;min-width:0;accent-color:var(--accent)}
.fstatus{margin-left:auto;font-size:11.5px;color:var(--muted)}
.item .nm small.where{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px}
.item .nm small.snip{display:block;color:var(--muted);font-size:11.5px;white-space:normal;margin-top:2px}
.item .nm{white-space:normal}
mark{background:rgba(245,184,75,.35);color:inherit;border-radius:2px;padding:0 1px}
.more-btn{margin:10px auto 0;display:block}
.back{display:none}
.back.show{display:inline-block}
.viewer img{max-width:100%;border-radius:8px;cursor:zoom-in;background:repeating-conic-gradient(#1a1e29 0 25%,#141720 0 50%) 0 0/20px 20px}
.viewer iframe{width:100%;height:calc(100vh - 220px);border:1px solid var(--line);border-radius:8px;background:#fff}
.viewer video,.viewer audio{width:100%}
.refs .item .why{font-size:11px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg3)}
.msg .role{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px;font-weight:600}
.msg.user{border-color:rgba(124,196,255,.35)}
.msg.user .role{color:var(--accent2)}
.msg.assistant .role{color:var(--accent)}
.msg.tool{opacity:.85}
.msg .md{font-size:13.5px}
details.jl{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg3)}
details.jl summary{padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.jl pre{margin:0;border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dbtable{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 260px)}
.dbtable table{border-collapse:collapse;font-size:12px;font-family:var(--mono)}
.dbtable th{position:sticky;top:0;background:var(--bg3);text-align:left}
.dbtable td,.dbtable th{border-bottom:1px solid var(--line);padding:5px 8px;max-width:420px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.err{color:var(--danger)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox .stage{max-width:94vw;max-height:84vh;display:flex;align-items:center;justify-content:center;cursor:default}
#lightbox .stage img,#lightbox .stage video{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:6px}
#lightbox .stage audio{width:60vw}
#lightbox .stage .vbox{display:flex;align-items:center;justify-content:center}
#lightbox .stage .vbox video{max-width:94vw;max-height:84vh}
#lightbox .stage.doc{width:min(1100px,94vw);height:84vh}
#lightbox .docview{width:100%;height:100%;overflow:auto;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
#lightbox .docview .ph{padding:30px}
.docframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
.docpaper{background:#fff;color:#1d2230;padding:40px 56px;min-height:100%;font-family:Georgia,serif;line-height:1.55}
.docpaper img{max-width:100%}
.doctext{padding:20px 28px}
.docthumb{max-width:60%;max-height:55vh;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-bottom:12px;background:#fff}
.viewer .docpaper{border-radius:8px}
.viewer .ph{color:var(--muted);text-align:center;padding:20px}
.gallery.docs .thumb{object-fit:contain;background:#f4f4f2}
.gallery .ph.doc{font-size:34px}
.gallery .badge.ext{top:auto;bottom:30px;left:6px;font-size:10px;background:rgba(20,24,34,.8)}
