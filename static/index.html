<script>
// ---------------- langue de l'interface (FR / EN) ----------------
// Le texte est écrit en français dans le code ; en anglais, il est traduit à l'affichage
// grâce au dictionnaire static/i18n/en.json (injecté par le serveur).
window.HM_LANG = (() => {
  const saved = '__HM_LANG__';
  if (saved === 'fr' || saved === 'en') return saved;
  return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
})();
window.HM_I18N = __HM_I18N__;
(() => {
  const D = window.HM_I18N || {}, EN = window.HM_LANG === 'en';
  const EXACT = new Map(Object.entries(D.exact || {}));
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // les clés les plus longues d'abord : « Durée : {0} · sauvegarde : » avant « Durée : {0} »
  const PATS = Object.entries(D.patterns || {}).sort((a, b) => b[0].length - a[0].length).map(([fr, en]) => {
    const re = '^' + esc(fr).replace(/\\\{(\d+)(#?)\\\}/g, (_, n, num) => num ? `(?<g${n}>\\d[\\d\\s., ]*)` : `(?<g${n}>[\\s\\S]*?)`) + '$';
    return [new RegExp(re), en, fr];
  });
  const BYKEY = new Map(Object.entries(D.patterns || {}));
  const core = s => {
    if (EXACT.has(s)) return EXACT.get(s);
    for (const [re, en] of PATS){
      const m = s.match(re);
      if (m) return en.replace(/\{(\d+)\}/g, (_, n) => { const v = m.groups['g' + n] || ''; return EXACT.has(v) ? EXACT.get(v) : v; });
    }
    // ponctuation finale ajoutée par le code (« … . » / « … : »)
    const p = s.match(/^([\s\S]*?)([.:;,!?]+)$/);
    if (p && p[1] && (EXACT.has(p[1]) || PATS.some(([re]) => re.test(p[1])))) return core(p[1]) + p[2];
    return null;
  };
  const trText = s => {
    if (!EN || !s || !/[A-Za-zÀ-ÿ]/.test(s)) return s;
    const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
    const c = m[2].replace(/\s+/g, ' ');
    const r = core(c);
    return r == null ? s : m[1] + r + m[3];
  };
  // T('Texte {0}', valeur) : pour les phrases construites dans le code
  window.T = (fr, ...args) => {
    let out = fr;
    if (EN){ if (EXACT.has(fr)) out = EXACT.get(fr); else if (BYKEY.has(fr)) out = BYKEY.get(fr); }
    return out.replace(/\{(\d+)#?\}/g, (_, n) => { const v = args[+n]; return v == null ? '' : (EN && EXACT.has(String(v)) ? EXACT.get(String(v)) : String(v)); });
  };
  window.trText = trText;
  if (!EN) return;
  // noms de fichiers, notes, chemins, tags : jamais traduits
  const SKIP = '.md, pre, code, textarea, script, style, .nm, .where, .snip, .crumbs, .tagchip, .lbl, #labels3d, .wl, .chat, .docpaper, .dbtable td, .mvcol span, .fm td, [data-noi18n]';
  const ATTRS = ['title', 'placeholder', 'aria-label'];
  const trEl = el => { for (const a of ATTRS){ const v = el.getAttribute && el.getAttribute(a); if (v){ const t = trText(v); if (t !== v) el.setAttribute(a, t); } } };
  const walk = root => {
    if (root.nodeType === 3){ const p = root.parentElement; if (p && !p.closest(SKIP)){ const t = trText(root.data); if (t !== root.data) root.data = t; } return; }
    if (root.nodeType !== 1 || root.closest(SKIP)) return;
    trEl(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {acceptNode: n => (n.nodeType === 1 && n.matches(SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    let n; while ((n = w.nextNode())){
      if (n.nodeType === 3){ const t = trText(n.data); if (t !== n.data) n.data = t; } else trEl(n);
    }
  };
  const start = () => {
    walk(document.body);
    new MutationObserver(ms => { for (const m of ms){
      if (m.type === 'childList') m.addedNodes.forEach(walk);
      else if (m.type === 'characterData') walk(m.target);
      else if (m.type === 'attributes' && !m.target.closest(SKIP)) trEl(m.target);
    } }).observe(document.body, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS});
    document.documentElement.lang = 'en';
  };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const ICONS = {root:'☤',dir:'📁',markdown:'📝',json:'🧾',config:'⚙️',text:'📄',image:'🖼️',pdf:'📕',audio:'🎵',video:'🎬',db:'🗄️',secret:'🔐',icloud:'☁️',tag:'🏷️',office:'📑',binary:'📦',more:'…',skill:'🧩'};
const PALETTE = ['#7cc4ff','#b48cff','#5fd3a6','#ff8a7a','#ffd36e','#6ee0e6','#9fd36b','#8aa2ff','#e0b48a','#f7a072','#a3e4b5','#c9b6ff'];
const GROUP_LABELS = {memories:'Mémoires',skills:'Skills',sessions:'Sessions',cron:'Tâches planifiées',logs:'Logs',profiles:'Profils',hooks:'Hooks',gateway:'Passerelle',plugins:'Plugins',root:'Racine (fichiers)',hub:'Hub',state:'État',workspace:'Espace de travail',documents:'Documents',images:'Images'};

let data = null, G = null;
let showRefs = true, showFiles = true, showLabels = true, showTags = true;
let hiddenGroups = new Set();
let selected = null, hoverNode = null;
let hl = new Set(), hlLinks = new Set();
let groupColor = {};
let byId = new Map();
let neighbors = new Map();
let currentImages = [], lbIndex = 0, lbList = [];
let panelPath = null, panelStack = [], dirState = null;
let refAlpha = .45;
let mode = '2d', G3 = null, g3Nodes = new Map(), autoRotate = true;
const TAG_COLOR = '#ff6fa0', AUTO_TAG_COLOR = '#7cc4ff';
const ACT = {read:{c:'#7cc4ff', ttl:6, label:'lit', icon:'👁'}, write:{c:'#f5b84b', ttl:12, label:'écrit', icon:'✏️'}, create:{c:'#5fd3a6', ttl:15, label:'crée', icon:'✨'}, move:{c:'#ff8a7a', ttl:15, label:'déplace', icon:'📦'}};
let activity = new Map(), liveOn = false, liveFeed = [], followCam = true, lastFollow = 0, liveTimer = null;

const fmtSize = n => n==null ? '' : n<1024 ? n+' o' : n<1048576 ? (n/1024).toFixed(1)+' Ko' : (n/1048576).toFixed(1)+' Mo';
const fmtDate = t => t ? new Date(t*1000).toLocaleString(HM_LANG === 'en' ? 'en-GB' : 'fr-FR',{dateStyle:'medium',timeStyle:'short'}) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconFor = n => n.skill ? ICONS.skill : (ICONS[n.kind] || '📄');
const raw = p => '/api/raw?path=' + encodeURIComponent(p);
const idOf = x => typeof x==='object' && x ? x.id : x;
const lkey = l => idOf(l.source) + '>' + idOf(l.target);
let CFG = {zone_prefix:'', archive_dir:null, hermes:{}};
const stripPrefix = t => { const p = CFG.zone_prefix || ''; return p && String(t).startsWith(p) ? String(t).slice(p.length) : String(t); };
const zoneName = g => GROUP_LABELS[g] ? T(GROUP_LABELS[g]) : stripPrefix(g);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const normTxt = t => String(t||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
const relWhere = (where, base) => { if (!base) return where || '/'; return where===base ? '.' : where.startsWith(base+'/') ? '…/' + where.slice(base.length+1) : where; };
function hlText(text, q){
  const words = normTxt(q).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return esc(text);
  const n = normTxt(text); const marks = new Array(text.length).fill(false);
  words.forEach(w => { let i = n.indexOf(w); while (i >= 0){ for (let k=i;k<i+w.length;k++) marks[k]=true; i = n.indexOf(w, i+w.length); } });
  let out = '', on = false;
  for (let i=0;i<text.length;i++){ if (marks[i]!==on){ out += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; } out += esc(text[i]); }
  return out + (on ? '</mark>' : '');
}
async function fetchGraph(refresh=false){ return (await fetch('/api/graph' + (refresh ? '?refresh=1' : ''))).json(); }

function indexData(){
  byId = new Map(data.nodes.map(n => [n.id, n]));
  neighbors = new Map(data.nodes.map(n => [n.id, new Set()]));
  data.nodes.forEach(n => n.deg = 0);
  data.links.forEach(l => {
    const s = idOf(l.source), t = idOf(l.target);
    neighbors.get(s)?.add(t); neighbors.get(t)?.add(s);
    const a = byId.get(s), b = byId.get(t); if (a) a.deg++; if (b) b.deg++;
  });
}

async function load(refresh=false){
  const prev = data ? data.scanned_at : 0;
  $('#loading').style.display='grid';
  try { CFG = await (await fetch('/api/config')).json(); } catch(e){}
  let g = await fetchGraph(refresh);
  if (g.setup){ $('#loading').style.display='none'; return showSetup(g); }
  // attendre que l'arborescence soit prête (le serveur analyse en arrière-plan)
  while (g.pending || (refresh && g.scanned_at === prev)){
    $('#loading').textContent = g.status || 'Analyse des dossiers…';
    await sleep(700);
    g = await fetchGraph();
  }
  if (data && refresh){
    // garder la disposition actuelle : les nœuds déjà connus reprennent leur place
    const old = new Map(data.nodes.map(n => [n.id, n]));
    g.nodes.forEach(n => { const o = old.get(n.id); if (o && o.x !== undefined){ n.x = o.x; n.y = o.y; if (o.fx !== undefined && !o._pin){ n.fx = o.fx; n.fy = o.fy; } } });
    g.nodes.forEach(n => { if (n.x === undefined){ const par = old.get(n.id.split('/').slice(0,-1).join('/')); if (par && par.x !== undefined){ n.x = par.x + (Math.random()-.5)*30; n.y = par.y + (Math.random()-.5)*30; } } });
  }
  data = g;
  $('#rootPath').textContent = data.root;
  const groups = [...new Set(data.nodes.map(n => n.group))].filter(x => x !== 'root' && x !== '#tags').sort();
  groupColor = {root:'#e6e8ee', '#tags': TAG_COLOR};
  groups.forEach((x,i) => groupColor[x] = PALETTE[i % PALETTE.length]);
  if (!refresh) g3Nodes = new Map();
  indexData();
  buildLegend();
  render();
  $('#loading').style.display='none';
  setTimeout(()=>$('#hint').style.opacity=0, 6000);
  if (!data.refs_done) waitRefs(data.scanned_at);
  if (!refresh){ let m = '2d'; try { m = localStorage.getItem('hm-mode') || '2d'; } catch(e){} if (m==='3d') setMode('3d'); }
}

// les liens entre fichiers et les tags arrivent dans un 2e temps : on les ajoute sans tout redessiner
async function waitRefs(stamp){
  while (true){
    await sleep(1500);
    const g = await fetchGraph();
    $('#stats').textContent = (g.status || '') + ' (les liens et tags apparaîtront à la fin)';
    if (g.refs_done){
      g.nodes.forEach(n => { if (!byId.has(n.id)) data.nodes.push(n); else if (n.tags) byId.get(n.id).tags = n.tags; });
      indexData();
      const extra = g.links.filter(l => (l.type==='ref' || l.type==='tag') && byId.has(l.source) && byId.has(l.target));
      data.links = data.links.concat(extra);
      data.refs_done = true;
      indexData(); buildLegend(); render();
      return;
    }
  }
}

function visibleData(){
  const keep = n => {
    if (n.kind==='root') return true;
    if (n.kind==='tag') return showTags;
    if (hiddenGroups.has(n.group)) return false;
    if (!showFiles && n.kind!=='dir' && n.kind!=='more') return false;
    return true;
  };
  const nodes = data.nodes.filter(keep);
  const ids = new Set(nodes.map(n=>n.id));
  const links = data.links.filter(l => (showRefs || l.type!=='ref') && ids.has(idOf(l.source)) && ids.has(idOf(l.target)));
  // un tag qui n'est plus relié à rien de visible disparaît aussi
  const linked = new Set(); links.forEach(l => { if (l.type==='tag') linked.add(idOf(l.source)); });
  return {nodes: nodes.filter(n => n.kind!=='tag' || linked.has(n.id)), links};
}

function nodeR(n){
  if (n.kind==='root') return 14;
  if (n.kind==='tag') return 4 + Math.min(9, Math.sqrt(n.count||1)*1.5);
  if (n.kind==='dir') return 5 + Math.min(8, Math.sqrt(n.deg||1)*1.6) + (n.depth===1?3:0);
  if (n.kind==='more') return 3;
  return 3 + Math.min(5, Math.sqrt(n.deg||1));
}

function linkRGBA(l, alpha){
  if (l.type==='live') return `rgba(95,211,166,${Math.max(alpha, .85)})`;
  const c = l.type==='ref' ? '245,184,75' : l.type==='tag' ? '255,111,160' : '160,170,195';
  return `rgba(${c},${alpha})`;
}
function linkColorFor(l){
  const on = hlLinks.size===0 || hlLinks.has(lkey(l));
  if (!on) return linkRGBA(l, .04);
  if (hlLinks.size) return linkRGBA(l, l.type==='tree' ? .7 : .95);
  return linkRGBA(l, l.type==='ref' ? refAlpha : l.type==='tag' ? .18 : .22);
}

function resizeGraph(){
  const el = mode==='3d' ? $('#graph3d') : $('#graph');
  const w = $('#graphWrap').clientWidth, h = $('#graphWrap').clientHeight;
  if (mode==='3d' && G3) G3.width(w).height(h);
  else if (G) G.width(w).height(h);
}

function render(){
  const vd = visibleData();
  const nRefs = vd.links.filter(l=>l.type==='ref').length;
  refAlpha = nRefs > 1500 ? .12 : nRefs > 500 ? .25 : .45;
  $('#stats').textContent = `${vd.nodes.length} nœuds · ${nRefs} liens · ${vd.nodes.filter(n=>n.kind==='tag').length} tags${data.truncated?' · (certains dossiers résumés)':''}`;
  if (mode==='3d') return render3d(vd);
  const el = $('#graph');
  if (!G){
    G = ForceGraph()(el)
      .backgroundColor('#0b0d12')
      .nodeId('id')
      .nodeRelSize(1)
      .nodeVal(n => nodeR(n)**2)
      .linkSource('source').linkTarget('target')
      .linkColor(linkColorFor)
      .linkWidth(l => l.type==='live' ? 2.2 : hlLinks.has(lkey(l)) ? 2 : (l.type==='ref' ? 1.1 : .8))
      .linkLineDash(l => l.type==='ref' ? [3,3] : l.type==='tag' ? [1,3] : null)
      .linkDirectionalParticles(l => l.type==='live' ? 4 : (l.type!=='tree' && hlLinks.has(lkey(l))) ? 3 : 0)
      .linkDirectionalParticleWidth(l => l.type==='live' ? 3.5 : 2.2)
      .linkDirectionalParticleSpeed(l => l.type==='live' ? .012 : .006)
      .linkDirectionalParticleColor(l => l.type==='live' ? '#5fd3a6' : l.type==='tag' ? TAG_COLOR : '#f5b84b')
      .nodeCanvasObject(drawNode)
      .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle=color; ctx.beginPath(); ctx.arc(n.x,n.y,nodeR(n)+3,0,2*Math.PI); ctx.fill(); })
      .onNodeHover(n => { hoverNode = n||null; el.style.cursor = n ? 'pointer':'default'; showTip(n); })
      .onNodeClick(n => selectNode(n.id, false))
      .onBackgroundClick(() => { clearHL(); })
      .onNodeDragEnd(n => { n.fx = n.x; n.fy = n.y; })
      .cooldownTicks(300)
      .warmupTicks(40);
    G.d3Force('charge').strength(n => n.kind==='root' ? -600 : n.kind==='dir' ? -140 : n.kind==='tag' ? -120 : -45);
    G.d3Force('link').distance(l => l.type==='ref' ? 90 : l.type==='tag' ? 70 : (byId.get(idOf(l.target))?.kind==='dir' ? 55 : 28))
      .strength(l => l.type==='live' ? 0 : l.type==='ref' ? .04 : l.type==='tag' ? .03 : .9);
    window.addEventListener('resize', resizeGraph);
    el.addEventListener('mousemove', e => { tipPos = [e.clientX, e.clientY]; moveTip(); });
    let fitted=false;
    G.onEngineStop(() => { if(!fitted){ G.zoomToFit(600, 60); fitted=true; } });
  }
  G.graphData(vd);
  resizeGraph();
}

function drawNode(n, ctx, scale){
  const r = nodeR(n);
  const dim = hl.size>0 && !hl.has(n.id);
  const col = groupColor[n.group] || '#aaa';
  ctx.globalAlpha = dim && !activity.has(n.id) ? .12 : 1;
  if (n.kind==='tag'){
    // losange rose pour les tags
    ctx.beginPath(); ctx.moveTo(n.x, n.y-r); ctx.lineTo(n.x+r, n.y); ctx.lineTo(n.x, n.y+r); ctx.lineTo(n.x-r, n.y); ctx.closePath();
    ctx.fillStyle = n.auto ? 'rgba(124,196,255,.22)' : 'rgba(255,111,160,.25)'; ctx.fill(); ctx.lineWidth = Math.max(1.4, 2/scale); ctx.strokeStyle = n.auto ? AUTO_TAG_COLOR : TAG_COLOR; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2*Math.PI);
    if (n.kind==='dir' || n.kind==='root'){
      ctx.fillStyle = n.kind==='root' ? '#f5b84b' : col; ctx.fill();
      ctx.lineWidth = 1.5/scale; ctx.strokeStyle = '#0b0d12'; ctx.stroke();
    } else if (n.kind==='more' || n.kind==='icloud' || n.cloud){
      ctx.fillStyle = '#3a4152'; ctx.fill();
    } else {
      ctx.fillStyle = '#0b0d12'; ctx.fill();
      ctx.lineWidth = Math.max(1.2, 2/scale); ctx.strokeStyle = col; ctx.stroke();
      if (n.kind==='image'){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(n.x,n.y,r*.45,0,2*Math.PI); ctx.fill(); }
    }
  }
  if (n.skill){ ctx.lineWidth = 2/scale; ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(n.x,n.y,r+2.5/scale,0,2*Math.PI); ctx.stroke(); }
  const act = activity.get(n.id);
  if (act){
    const ph = (performance.now()/1000 * 2.2) % 1;              // onde qui s'élargit
    const c = ACT[act.kind].c;
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 3/scale + ph * 22/scale, 0, 2*Math.PI);
    ctx.strokeStyle = c; ctx.lineWidth = 2.2/scale; ctx.globalAlpha = 1 - ph; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 2.5/scale, 0, 2*Math.PI); ctx.strokeStyle = c; ctx.lineWidth = 2.5/scale; ctx.stroke();
    ctx.shadowColor = c; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(n.x, n.y, r*.6, 0, 2*Math.PI); ctx.fillStyle = c; ctx.fill(); ctx.shadowBlur = 0;
  }
  if (selected === n.id){
    ctx.lineWidth = 3/scale; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(n.x,n.y,r+5/scale,0,2*Math.PI); ctx.stroke();
  }
  // libellés : toujours pour racine/dossiers de 1er niveau/tags, sinon selon le zoom
  const important = activity.has(n.id) || n.kind==='root' || n.kind==='tag' || (n.kind==='dir' && n.depth<=1) || selected===n.id || hoverNode===n || (hl.size && hl.has(n.id));
  const showAt = n.kind==='dir' ? 1.1 : 2.2;
  if (showLabels && (important || scale > showAt)){
    const fs = (n.kind==='root'? 15 : n.kind==='dir' || n.kind==='tag' ? 12 : 10.5) / Math.min(scale, 2.4) * (important && scale<1 ? 1.25 : 1);
    ctx.font = `${n.kind==='dir'||n.kind==='root'||n.kind==='tag' ? 600 : 400} ${fs}px -apple-system, Inter, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    const label = n.name.length>32 ? n.name.slice(0,30)+'…' : n.name;
    ctx.lineWidth = 3/scale; ctx.strokeStyle='rgba(11,13,18,.9)'; ctx.strokeText(label, n.x, n.y + r + 2/scale);
    ctx.fillStyle = dim ? 'rgba(230,232,238,.3)' : n.kind==='tag' ? (n.auto ? '#cfe7ff' : '#ffc1d6') : (n.kind==='dir'||n.kind==='root' ? '#f1f2f6' : '#b9bfcd');
    ctx.fillText(label, n.x, n.y + r + 2/scale);
  }
  ctx.globalAlpha = 1;
}

// ---------------- Vue 3D (sphère) ----------------
function nodeColor3d(n){
  const act = activity.get(n.id);
  if (act) return (Math.floor(performance.now()/350) % 2) ? ACT[act.kind].c : '#ffffff';
  if (hl.size && !hl.has(n.id)) return '#22262f';
  if (n.kind==='root') return '#f5b84b';
  if (n.kind==='tag') return n.auto ? AUTO_TAG_COLOR : TAG_COLOR;
  if (n.kind==='more' || n.kind==='icloud' || n.cloud) return '#4a5163';
  return groupColor[n.group] || '#aaa';
}
function render3d(vd){
  const el = $('#graph3d');
  // on réutilise les mêmes objets 3D d'un rendu à l'autre pour garder les positions
  const nodes = vd.nodes.map(n => { let o = g3Nodes.get(n.id); if (!o){ o = {id:n.id}; g3Nodes.set(n.id, o); } o.ref = n; return o; });
  const links = vd.links.map(l => ({source: idOf(l.source), target: idOf(l.target), type: l.type}));
  if (!G3){
    G3 = ForceGraph3D({controlType: 'orbit'})(el)
      .backgroundColor('#05060a')
      .showNavInfo(false)
      .nodeId('id')
      .nodeRelSize(3.2)
      .nodeVal(o => { const n = o.ref; return n.kind==='root' ? 30 : n.kind==='tag' ? 3 + Math.min(12, (n.count||1)*.4) : n.kind==='dir' ? 2 + Math.min(10, (n.deg||1)*.15) : .7; })
      .nodeColor(o => nodeColor3d(o.ref))
      .nodeOpacity(.92)
      .nodeResolution(12)
      .nodeLabel(o => `<div style="background:#12151d;border:1px solid #262b38;border-radius:8px;padding:6px 9px;font:12px -apple-system,sans-serif;color:#e6e8ee">${iconFor(o.ref)} <b>${esc(o.ref.name)}</b><br><span style="color:#8b92a5;font-family:monospace;font-size:11px">${esc(o.ref.path||'/')}</span></div>`)
      .linkColor(linkColorFor)
      .linkOpacity(1)
      .linkWidth(l => l.type==='live' ? 1.6 : hlLinks.has(lkey(l)) ? 1.2 : 0)
      .linkDirectionalParticles(l => l.type==='live' ? 4 : (l.type!=='tree' && hlLinks.has(lkey(l))) ? 3 : 0)
      .linkDirectionalParticleWidth(1.6)
      .linkDirectionalParticleColor(l => l.type==='live' ? '#5fd3a6' : l.type==='tag' ? TAG_COLOR : '#f5b84b')
      .onNodeClick(o => selectNode(o.id, true))
      .onNodeHover(o => { el.style.cursor = o ? 'pointer' : 'default'; })
      .onBackgroundClick(() => clearHL())
      .cooldownTicks(400)
      .warmupTicks(30);
    G3.d3Force('charge').strength(o => o.ref.kind==='root' ? -400 : o.ref.kind==='dir' ? -90 : o.ref.kind==='tag' ? -80 : -25);
    G3.d3Force('link').distance(l => l.type==='tree' ? (byId.get(idOf(l.target))?.kind==='dir' ? 40 : 18) : 60)
      .strength(l => l.type==='live' ? 0 : l.type==='tree' ? .9 : .03);
    const c = G3.controls(); c.autoRotate = autoRotate; c.autoRotateSpeed = .8;
    c.addEventListener && c.addEventListener('start', () => { /* l'utilisateur tourne : on garde sa vue */ });
    requestAnimationFrame(drawLabels3d);
  }
  G3.graphData({nodes, links});
  resizeGraph();
}

// étiquettes HTML posées par-dessus la scène 3D (racine, zones, tags, sélection)
function drawLabels3d(){
  if (mode !== '3d' || !G3){ return; }
  const box = $('#labels3d');
  const cam = G3.camera().position;
  const want = [];
  G3.graphData().nodes.forEach(o => {
    const n = o.ref; if (o.x === undefined) return;
    const imp = activity.has(n.id) || n.kind==='root' || (n.kind==='dir' && n.depth<=1) || n.id===selected || (n.kind==='tag' && (n.count||0) >= 2) || (hl.size && hl.has(n.id) && hl.size < 60);
    if (showLabels && imp) want.push(o);
  });
  let html = '';
  want.slice(0, 160).forEach(o => {
    const p = G3.graph2ScreenCoords(o.x, o.y, o.z);
    const d = Math.hypot(cam.x-o.x, cam.y-o.y, cam.z-o.z);
    const op = Math.max(.25, Math.min(1, 900 / d));
    const n = o.ref, dim = hl.size && !hl.has(n.id);
    const act = activity.get(n.id);
    html += `<span class="l3 ${n.kind}" style="left:${p.x}px;top:${p.y}px;opacity:${act ? 1 : dim ? .2 : op}${act ? ';color:' + ACT[act.kind].c : ''}">${act ? ACT[act.kind].icon + ' ' : ''}${esc(n.kind==='dir' && n.depth===1 ? zoneName(n.name) : n.name)}</span>`;
  });
  box.innerHTML = html;
  requestAnimationFrame(drawLabels3d);
}

function setMode(m){
  mode = m;
  $('#t3d').classList.toggle('on', m==='3d');
  $('#tRotate').style.display = m==='3d' ? '' : 'none';
  $('#graph').style.display = m==='3d' ? 'none' : '';
  $('#graph3d').style.display = m==='3d' ? '' : 'none';
  $('#labels3d').style.display = m==='3d' ? '' : 'none';
  if (m==='3d'){ G && G.pauseAnimation(); G3 && G3.resumeAnimation(); render(); requestAnimationFrame(drawLabels3d); }
  else { G3 && G3.pauseAnimation(); G && G.resumeAnimation(); render(); }
  try { localStorage.setItem('hm-mode', m); } catch(e){}
}

function refreshStyles(){
  if (mode==='3d' && G3){ G3.nodeColor(G3.nodeColor()).linkColor(G3.linkColor()).linkWidth(G3.linkWidth()).linkDirectionalParticles(G3.linkDirectionalParticles()); }
}

let tipPos=[0,0];
function showTip(n){
  const t=$('#tip');
  if(!n){ t.style.display='none'; return; }
  t.innerHTML = `${iconFor(n)} <b>${esc(n.name)}</b><small>${n.kind==='tag' ? (n.count+' fichier(s)') : esc(n.path||'/')}${n.size!=null?' · '+fmtSize(n.size):''}</small>`;
  t.style.display='block'; moveTip();
}
function moveTip(){ const t=$('#tip'); t.style.left=(tipPos[0]+14)+'px'; t.style.top=(tipPos[1]+14)+'px'; }

// ---------------- Barre latérale : zones (tags de dossier) + tags du contenu ----------------
let tagQuery = '', tagShowAll = false;
let legendCollapsed = false; try { legendCollapsed = !!localStorage.getItem('hm-legend'); } catch(e){}
function zoneTagsHtml(groups, counts, tq){
  const zs = groups.filter(g => !tq || normTxt(zoneName(g)).includes(normTxt(tq)));
  if (!zs.length) return '';
  return `<div class="tgtitle">Zones</div><div class="tagcloud">` + zs.map(g =>
    `<span class="tagchip zone ${selected===g?'on':''}" data-zone="${esc(g)}" style="--zc:${groupColor[g]}" title="Voir tout ${esc(zoneName(g))}">${esc(zoneName(g))}<small>${counts[g]}</small></span>`).join('') + '</div>';
}
function tagGroup(title, list, limit){
  if (!list.length) return '';
  return `<div class="tgtitle">${title}</div><div class="tagcloud">` + list.slice(0, limit).map(t =>
    `<span class="tagchip ${t.auto?'auto':''} ${selected===t.id?'on':''}" data-id="${esc(t.id)}" title="${t.auto ? T('Présent dans {0}', esc((t.zones||[]).map(zoneName).join(', '))) : 'Tag écrit dans tes notes'}">${esc(t.name)}<small>${t.count}</small></span>`).join('') + '</div>';
}
function buildLegend(){
  const counts = {};
  data.nodes.forEach(n => { if (n.kind!=='root' && n.kind!=='tag') counts[n.group]=(counts[n.group]||0)+1; });
  const groups = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const tags = data.nodes.filter(n => n.kind==='tag').sort((a,b) => (b.count||0)-(a.count||0) || a.name.localeCompare(b.name));
  const tq = tagQuery.toLowerCase();
  const tagsShown = tags.filter(t => !tq || t.name.toLowerCase().includes(tq));
  const limit = tagShowAll ? tagsShown.length : 30;
  $('#legend').classList.toggle('collapsed', legendCollapsed);
  $('#legend').innerHTML = `<button class="tbtn lcol" id="lcol" title="Replier / déplier">${legendCollapsed ? '▸ Zones & tags' : '▾'}</button>` +
    '<h4>Zones <span class="hint">clic = voir · œil = masquer</span></h4>' + groups.map(g =>
      `<div class="row ${hiddenGroups.has(g)?'off':''}" data-g="${esc(g)}"><span class="dot" style="background:${groupColor[g]}"></span><span class="lbl">${esc(zoneName(g))}</span><span class="count">${counts[g]}</span><span class="eye" title="Masquer / afficher">${hiddenGroups.has(g)?'◌':'◉'}</span></div>`).join('')
    + `<h4 style="margin-top:10px">Tags ${tags.length ? `<span class="hint">${tags.length} · clic = voir les éléments liés</span>` : ''}</h4>`
    + (tags.length || groups.length
        ? `<input id="tagq" placeholder="Chercher un tag…" value="${esc(tagQuery)}" autocomplete="off">`
          + zoneTagsHtml(groups, counts, tq)
          + tagGroup('Dans tes notes', tagsShown.filter(t => !t.auto), limit)
          + tagGroup('Mots récurrents dans les noms', tagsShown.filter(t => t.auto), limit)
          + (tagsShown.length > limit ? `<button class="tbtn" id="tagAll" style="margin-top:6px;font-size:12px">Voir les ${tagsShown.length} tags</button>` : '')
        : `<div class="hint" style="padding:2px 4px">${data.refs_done ? 'Aucun tag trouvé.' : 'Calcul des tags…'}</div>`)
    + '<h4 style="margin-top:10px">Formes</h4><div class="row" style="cursor:default;flex-wrap:wrap">● dossier ○ fichier ◎ skill <span style="color:#ff6fa0">◆</span> tag de note <span style="color:#7cc4ff">◆</span> tag auto <span style="color:#f5b84b">┄</span> lien</div>';
  $('#lcol').onclick = () => { legendCollapsed = !legendCollapsed; try{ localStorage.setItem('hm-legend', legendCollapsed?'1':''); }catch(e){} buildLegend(); };
  $('#legend').querySelectorAll('.row[data-g]').forEach(r => {
    const g = r.dataset.g;
    r.querySelector('.eye').onclick = e => { e.stopPropagation(); hiddenGroups.has(g) ? hiddenGroups.delete(g) : hiddenGroups.add(g); buildLegend(); render(); };
    r.onclick = () => { if (hiddenGroups.has(g)){ hiddenGroups.delete(g); buildLegend(); render(); } if (byId.has(g)) selectNode(g, true); };
  });
  $('#legend').querySelectorAll('.tagchip[data-zone]').forEach(c => c.onclick = () => {
    const g = c.dataset.zone;
    if (hiddenGroups.has(g)){ hiddenGroups.delete(g); buildLegend(); render(); }
    selectNode(g, true);
  });
  $('#legend').querySelectorAll('.tagchip[data-id]').forEach(c => c.onclick = () => {
    if (!showTags){ showTags = true; $('#tTags').classList.add('on'); render(); }
    setTimeout(() => selectNode(c.dataset.id, true), 60);
  });
  const tqEl = $('#tagq');
  if (tqEl) tqEl.oninput = () => { tagQuery = tqEl.value; const pos = tqEl.selectionStart; buildLegend(); const e2=$('#tagq'); e2.focus(); e2.setSelectionRange(pos,pos); };
  $('#tagAll') && ($('#tagAll').onclick = () => { tagShowAll = true; buildLegend(); });
}

function clearHL(){ selected=null; hl.clear(); hlLinks.clear(); G && G.nodeColor(G.nodeColor()); refreshStyles(); buildLegendSel(); }
function buildLegendSel(){ document.querySelectorAll('#legend .tagchip').forEach(c => c.classList.toggle('on', (c.dataset.id||c.dataset.zone)===selected)); }

function highlight(id){
  hl = new Set([id, ...(neighbors.get(id)||[])]);
  hlLinks = new Set();
  data.links.forEach(l => { const s = idOf(l.source), t = idOf(l.target); if (s===id || t===id) hlLinks.add(s+'>'+t); });
  refreshStyles(); buildLegendSel();
}

function selectNode(id, center=true){
  if (id==='') id='/';
  const n = byId.get(id);
  if (n && n.kind==='more'){ openPanel(n.path || '/'); return; }
  selected = id;
  highlight(id);
  const wasHidden = $('#panel').classList.contains('hidden');
  openPanel(id==='/' ? '' : id);
  // cadrer après l'ouverture du panneau (qui réduit la largeur de la carte)
  if (center) setTimeout(() => focusNode(id), wasHidden ? 80 : 0);
}

function focusNode(id){
  const nn = byId.get(id);
  if (nn && nn.kind==='tag' && hl.size > 1){
    if (mode==='3d' && G3) G3.zoomToFit(1000, 60, o => hl.has(o.id));
    else if (G) G.zoomToFit(800, 80, n => hl.has(n.id));
    return;
  }
  {
    if (mode==='3d' && G3){
      const o = g3Nodes.get(id);
      if (o && o.x !== undefined){
        const dist = 280, r = Math.hypot(o.x, o.y, o.z) || 1, k = 1 + dist / r;
        autoRotate = false; G3.controls().autoRotate = false; $('#tRotate').classList.remove('on');
        G3.cameraPosition({x: o.x*k, y: o.y*k, z: o.z*k}, o, 1200);
      }
    } else if (G){
      const gn = G.graphData().nodes.find(x => x.id===id);
      if (gn){ G.centerAt(gn.x, gn.y, 700); if (G.zoom()<1.6) G.zoom(2.2, 700); }
    }
  }
}

// ---------------- Panneau de droite ----------------
async function openPanel(path, opts={}){
  if (panelPath !== null && panelPath !== path && !opts.back){
    panelStack.push({path: panelPath, scroll: $('#pbody').scrollTop,
                     dir: dirState && dirState.path===panelPath ? {...dirState, info:null} : null});
    if (panelStack.length > 50) panelStack.shift();
  }
  panelPath = path;
  $('#phermes').style.display = (path && !path.startsWith('#tag:')) ? '' : 'none';
  $('#pback2').classList.toggle('show', panelStack.length > 0);
  $('#panel').classList.remove('hidden'); $('#resizer').classList.remove('hidden');
  setTimeout(resizeGraph, 0);
  const body = $('#pbody');
  body.innerHTML = '<div class="empty">Chargement…</div>';
  const r = await fetch('/api/node?path=' + encodeURIComponent(path));
  const info = await r.json();
  if (info.error){ body.innerHTML = `<div class="err">${esc(info.error)}</div>`; return; }
  const node = byId.get(path||'/') || {kind:info.kind};
  const k0 = info.kind;
  // fil d'Ariane
  const parts = k0==='tag' ? [] : (info.path||'').split('/').filter(Boolean);
  let acc = '';
  $('#crumbs').innerHTML = `<a data-p="/">☤ ${esc(data.title)}</a>` + parts.map((p,i) => {
    acc += (i?'/':'') + p; return ` / <a data-p="${esc(acc)}">${esc(p)}</a>`; }).join('');
  if (k0==='tag') $('#crumbs').innerHTML += ' / Tags' + (node.auto ? ' automatiques' : '');
  $('#crumbs').querySelectorAll('a').forEach(a => a.onclick = () => selectNode(a.dataset.p));
  $('#picon').textContent = iconFor({...node, kind:info.kind});
  $('#ptitle').textContent = info.path ? info.name : (data.title || 'Racine');
  const chips = [];
  chips.push(kindLabel(info.kind, node.skill));
  if (info.kind!=='dir' && info.kind!=='tag') chips.push(fmtSize(info.size));
  if (info.children_total!=null) chips.push(T('{0} éléments', info.children_total) + (info.mirror ? ' · ' + T("{0} dans l'archive", info.mirror.total) : ''));
  if (info.mtime) chips.push(T('modifié {0}', fmtDate(info.mtime)));
  $('#pmeta').innerHTML = chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('') + (info.cloud?'<span class="chip warn">☁️ dans iCloud, téléchargement à l\'ouverture</span>':'') + (info.masked?'<span class="chip warn">🔐 valeurs masquées</span>':'') + (info.truncated?'<span class="chip warn">tronqué à 2 Mo</span>':'');
  const zone = node.group && node.group!=='root' && node.group!=='#tags' ? node.group : null;
  if (node.kind==='tag' && node.auto){
    $('#pmeta').innerHTML += `<div class="ntags"><span class="chip">mot présent dans les noms de ${node.count} élément(s), dans :</span>${(node.zones||[]).map(z => `<span class="tagchip" data-zone="${esc(z)}" style="background:transparent;border-color:${groupColor[z]};color:${groupColor[z]}">${esc(zoneName(z))}</span>`).join('')}</div>`;
    $('#pmeta').querySelectorAll('[data-zone]').forEach(c => c.onclick = () => selectNode(c.dataset.zone, true));
  }
  const ntags = (node.tags||[]);
  if (zone || ntags.length){
    $('#pmeta').innerHTML += `<div class="ntags">${zone ? `<span class="tagchip" data-zone="${esc(zone)}" style="background:transparent;border-color:${groupColor[zone]};color:${groupColor[zone]}">${esc(zoneName(zone))}</span>` : ''}${ntags.map(t => `<span class="tagchip" data-id="${esc('#tag:'+t)}">#${esc(t)}</span>`).join('')}</div>`;
    $('#pmeta').querySelectorAll('.tagchip').forEach(c => c.onclick = () => {
      if (c.dataset.zone) return selectNode(c.dataset.zone, true);
      if (!showTags){ showTags = true; $('#tTags').classList.add('on'); render(); }
      setTimeout(() => selectNode(c.dataset.id, true), 60);
    });
  }

  let html = '';
  const k = info.kind;
  if (k==='dir' || k==='tag'){
    if (info.readme){ html += `<div class="section">${esc(info.readme.name)}</div>` + renderMarkdown(info.readme.text, info.path); }
    const prev = (opts.restore && opts.restore.dir) || {};
    dirState = {path: info.path, info, q: prev.q||'', type: prev.type||'all', size: prev.size||'all',
                sort: prev.sort||'name', mediaLimit: prev.mediaLimit||120, listLimit: prev.listLimit||400,
                deep: prev.deep ?? true, content: prev.content || false, results: null,
                withArchive: prev.withArchive ?? true, sel: new Set()};
    html = dirFiltersHtml(info) + html + `<div id="dirMedia"></div><div id="dirList"></div>`;
  } else if (k==='image'){
    currentImages = [info.path];
    html += `<div class="viewer"><img src="${raw(info.path)}" data-i="0" alt=""></div>`;
  } else if (k==='pdf'){
    html += `<div class="viewer"><iframe src="${raw(info.path)}"></iframe></div>`;
  } else if (k==='video'){
    html += `<div class="viewer" id="pvideo"></div>`;
  } else if (k==='office'){
    html += `<div class="viewer" id="pdoc"></div>`;
  } else if (k==='audio'){
    html += `<div class="viewer"><audio controls src="${raw(info.path)}"></audio></div>`;
  } else if (k==='db'){
    html += `<div class="section">Tables</div><div class="tabs">` + info.tables.map(t =>
      `<button class="tbtn" data-t="${esc(t.name)}">${esc(t.name)} <span style="color:var(--muted)">${t.rows??''}</span></button>`).join('') + `</div><div id="dbview" class="empty">Choisis une table.</div>`;
  } else if (k==='icloud'){
    html += `<div class="empty">☁️ ${esc(info.note)}</div>`;
  } else if (info.text != null){
    html += renderText(info);
  } else {
    html += `<div class="empty">Fichier binaire — aperçu non disponible. <a href="${raw(info.path)}" target="_blank" style="color:var(--accent2)">Ouvrir / télécharger</a></div>`;
  }
  html += renderRefs(path||'/');
  body.innerHTML = html;
  if (k !== 'dir' && k !== 'tag'){ dirState = null; renderSelBar(); }
  wirePanel(body, info);
  if (k === 'video') playVideo($('#pvideo'), {path: info.path, name: info.name});
  if (k === 'office') renderDocInto($('#pdoc'), {path: info.path, name: info.name});
  if (k !== 'dir' && k !== 'tag' && k !== 'root' && info.path){
    $('#pmeta').insertAdjacentHTML('beforeend', `<span class="chip link" data-app="${esc(info.path)}" title="Ouvrir avec l'app par défaut du Mac">↗ Ouvrir dans l'app</span><span class="chip link" data-finder="${esc(info.path)}">Finder</span>`);
    wireAppButtons($('#pmeta'));
  }
  if (k === 'dir' || k === 'tag'){ wireFilters(); renderDirView(); }
  body.scrollTop = (opts.restore && opts.restore.scroll) || 0;
}

function panelBack(){
  const prev = panelStack.pop();
  if (!prev) return;
  if (byId.has(prev.path || '/')){ selected = prev.path || '/'; highlight(selected); }
  openPanel(prev.path, {back:true, restore:prev});
}

// ---------------- Vue dossier : filtres, galerie, liste ----------------
const CATS = [['all','Tout'],['dir','Dossiers'],['image','Images'],['video','Vidéos'],['audio','Audio'],['doc','Documents'],['other','Autres']];
function catOf(c){
  if (c.kind==='dir') return 'dir';
  if (c.kind==='image' || c.kind==='video' || c.kind==='audio') return c.kind;
  if (['markdown','text','config','json','pdf','office'].includes(c.kind)) return 'doc';
  const e = ((c.name||'').split('.').pop()||'').toLowerCase();
  if (VIDEO_RE.test('.'+e)) return 'video';
  if (c.kind==='icloud'){
    if (['jpg','jpeg','png','gif','webp','heic'].includes(e)) return 'image';
    if (DOC_RE.test('.'+e)) return 'doc'; }
  return 'other';
}
const VIDEO_RE = /\.(mp4|m4v|webm|mov|ogv|avi|mkv|wmv|flv|mpg|mpeg|m2v|3gp|3g2|ts|mts|m2ts|vob|divx|xvid|rm|rmvb|asf|f4v)$/i;
const WEBVIDEO_RE = /\.(mp4|m4v|webm|mov|ogv)$/i;
const DOC_RE = /\.(pdf|txt|md|markdown|json|jsonl|ya?ml|csv|log|rtf|rtfd|docx?|odt|pages|xlsx?|ods|numbers|pptx?|odp|key|epub)$/i;
const isMedia = c => ['image','video','audio'].includes(catOf(c));
const isViewable = c => isMedia(c) || catOf(c)==='doc';
const extOf = c => ((c.name||'').split('.').pop()||'').toUpperCase().slice(0,5);
const SIZES = [['all','Toutes tailles'],['s','< 1 Mo'],['m','1 – 10 Mo'],['l','10 – 100 Mo'],['xl','> 100 Mo']];
const sizeOk = (c, f) => f==='all' || c.kind==='dir' || (f==='s' ? c.size<1048576 : f==='m' ? c.size>=1048576 && c.size<10485760 : f==='l' ? c.size>=10485760 && c.size<104857600 : c.size>=104857600);

function dirFiltersHtml(info){
  const isTag = info.kind==='tag';
  return `<div class="filters">
    <div class="row"><input id="fq" placeholder="${isTag ? 'Filtrer ces éléments…' : 'Chercher ici et dans tous les sous-dossiers…'}" autocomplete="off">
      <select id="fsort" title="Trier"><option value="name">Nom A→Z</option><option value="name-desc">Nom Z→A</option>
        <option value="size-desc">Plus gros d'abord</option><option value="size">Plus petits d'abord</option>
        <option value="date-desc">Plus récents</option><option value="date">Plus anciens</option></select>
      <select id="fsize" title="Taille">${SIZES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    ${isTag ? '' : `<div class="row opts">
      <label title="Décoché : seulement les éléments directement dans ce dossier"><input type="checkbox" id="fdeep"> Sous-dossiers inclus</label>
      <label title="Cherche aussi le texte à l'intérieur des notes (.md, .txt, .json…) — plus lent"><input type="checkbox" id="fcontent"> Dans le contenu des fichiers</label>
      <span class="fstatus" id="fstatus"></span></div>`}
    ${info.mirror ? `<div class="row mirror"><label title="Les fichiers de ce dossier sont rangés dans l'archive miroir"><input type="checkbox" id="farch"> 🗄 Inclure l'archive miroir</label>
      <a class="mlink" data-open="${esc(info.mirror.path)}">${esc(info.mirror.path)}</a><span class="fstatus">${info.mirror.total} élément(s)${info.mirror.described ? ` · ${info.mirror.described} décrit(s) dans les catalogues` : ''}</span></div>` : ''}
    ${info.brain ? `<div class="row mirror"><span>📝 Notes liées à ce dossier :</span><a class="mlink" data-open="${esc(info.brain)}">${esc(info.brain)}</a></div>` : ''}
    <div class="row" id="fcats"></div>
  </div>`;
}

function wireFilters(){
  const st = dirState;
  $('#fq').value = st.q; $('#fsort').value = st.sort; $('#fsize').value = st.size;
  if ($('#fdeep')){ $('#fdeep').checked = st.deep; $('#fcontent').checked = st.content; }
  if ($('#farch')){ $('#farch').checked = st.withArchive; $('#farch').onchange = () => { st.withArchive = $('#farch').checked; st.mediaLimit=120; runSearch(); }; }
  document.querySelectorAll('.filters .mlink').forEach(a => a.onclick = () => { const p = a.dataset.open; byId.has(p) ? selectNode(p, true) : openPanel(p); });
  let t;
  const changed = () => { st.mediaLimit=120; st.listLimit=400; runSearch(); };
  $('#fq').oninput = () => { clearTimeout(t); t = setTimeout(() => { st.q = $('#fq').value; changed(); }, 220); };
  $('#fq').onkeydown = e => { if (e.key==='Escape'){ $('#fq').value=''; st.q=''; changed(); e.stopPropagation(); $('#fq').blur(); } };
  $('#fsort').onchange = () => { st.sort = $('#fsort').value; renderDirView(); };
  $('#fsize').onchange = () => { st.size = $('#fsize').value; renderDirView(); };
  if ($('#fdeep')){
    $('#fdeep').onchange = () => { st.deep = $('#fdeep').checked; changed(); };
    $('#fcontent').onchange = () => { st.content = $('#fcontent').checked; if (st.content) st.deep = $('#fdeep').checked = true; changed(); };
  }
  if (st.q && st.deep && st.info.kind!=='tag') runSearch(); else renderDirView();
}

// recherche récursive côté serveur (tout l'arbre sous ce dossier, même ce qui n'est pas sur la carte)
let searchSeq = 0;
async function runSearch(){
  const st = dirState; if (!st) return;
  const q = st.q.trim();
  if (!q || !st.deep || st.info.kind==='tag'){ st.results = null; return renderDirView(); }
  const my = ++searchSeq;
  $('#fstatus') && ($('#fstatus').textContent = st.content ? 'Recherche (noms + contenu)…' : 'Recherche…');
  let r;
  while (true){
    r = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&path=${encodeURIComponent(st.info.path||'')}&content=${st.content?1:0}&limit=3000`)).json();
    if (my !== searchSeq || dirState !== st) return;
    if (!r.pending) break;
    $('#fstatus').textContent = 'Indexation en cours… ' + (r.status||'');
    await sleep(1200);
  }
  st.results = r.results || [];
  st.resultsInfo = r;
  if (st.info.mirror && st.withArchive){
    const r2 = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&path=${encodeURIComponent(st.info.mirror.path)}&content=${st.content?1:0}&limit=3000`)).json();
    if (my !== searchSeq || dirState !== st) return;
    (r2.results || []).forEach(x => { x.archive = true; st.results.push(x); });
    st.resultsInfo = {...r, total: (r.total||0) + (r2.total||0), content_hits: (r.content_hits||0) + (r2.content_hits||0), truncated: r.truncated || r2.truncated};
  }
  renderDirView();
}

function filteredChildren(){
  const st = dirState;
  const fromSearch = st.results != null;
  const base = fromSearch ? st.results
    : st.info.children.concat(st.info.mirror && st.withArchive ? st.info.mirror.items : []);
  const words = fromSearch ? [] : normTxt(st.q.trim()).split(/\s+/).filter(Boolean);
  const pre = base.filter(c => sizeOk(c, st.size) && words.every(w => normTxt(c.name).includes(w)));
  st.counts = {all: pre.length};
  pre.forEach(c => { const k = catOf(c); st.counts[k] = (st.counts[k]||0)+1; });
  let list = pre.filter(c => st.type==='all' || catOf(c)===st.type);
  const by = {
    'name': (a,b) => a.name.localeCompare(b.name, 'fr', {numeric:true}),
    'name-desc': (a,b) => b.name.localeCompare(a.name, 'fr', {numeric:true}),
    'size': (a,b) => (a.size||0)-(b.size||0), 'size-desc': (a,b) => (b.size||0)-(a.size||0),
    'date': (a,b) => a.mtime-b.mtime, 'date-desc': (a,b) => b.mtime-a.mtime }[st.sort];
  // résultats de recherche : d'abord ceux dont le NOM correspond, puis ceux trouvés via un dossier parent, puis le contenu
  const mrank = c => ({nom:0, chemin:1, contenu:2})[c.match] ?? 0;
  list.sort((a,b) => (fromSearch && st.sort==='name' ? mrank(a)-mrank(b) : 0)
    || (st.sort.startsWith('name') ? (a.kind==='dir'?0:1)-(b.kind==='dir'?0:1) : 0) || by(a,b));
  return list;
}

function renderCats(){
  const st = dirState, c = st.counts || {};
  $('#fcats').innerHTML = CATS.filter(([k]) => k==='all' || c[k] || st.type===k).map(([k,l]) =>
    `<span class="fchip ${st.type===k?'on':''}" data-k="${k}">${l}<small>${c[k]||0}</small></span>`).join('') + '<span class="fcount" id="fcount"></span>';
  document.querySelectorAll('#fcats .fchip').forEach(ch => ch.onclick = () => { st.type = ch.dataset.k; st.mediaLimit=120; renderDirView(); });
}

const thumbUrl = p => '/api/thumb?path=' + encodeURIComponent(p);
let tileObserver = null, vidObserver = null;
let animOn = true; try { animOn = localStorage.getItem('hm-anim') !== 'off'; } catch(e){}
const isAnimated = c => /\.(gif|webp|apng|avif)$/i.test(c.name || c.path || '');

function renderDirView(){
  const st = dirState; if (!st) return;
  const list = filteredChildren();
  renderCats();
  const media = list.filter(c => catOf(c)==='image' || catOf(c)==='video');
  if (st.results != null){
    const r = st.resultsInfo || {};
    $('#fcount').textContent = `${list.length} résultat(s)`;
    $('#fstatus') && ($('#fstatus').textContent = `${r.total} trouvé(s) dans ${st.info.path ? 'ce dossier et ses sous-dossiers' : 'tous les dossiers'}`
      + (r.truncated ? ' · 3 000 premiers affichés' : '') + (st.content ? ` · ${r.content_hits} dans le contenu${r.content_done ? '' : ' (recherche arrêtée après 8 s, affine les mots)'}` : ''));
  } else {
    const totalHere = st.info.children.length + (st.info.mirror && st.withArchive ? st.info.mirror.items.length : 0);
    $('#fcount').textContent = `${list.length} / ${totalHere}` + (st.info.children_total > st.info.children.length ? ` (sur ${st.info.children_total})` : '');
    $('#fstatus') && ($('#fstatus').textContent = '');
  }
  lbList = list.filter(isViewable);
  // galerie
  let h = '';
  if (media.length && st.type !== 'dir'){
    const shown = media.slice(0, st.mediaLimit);
    const nAnim = media.filter(c => isAnimated(c) || catOf(c)==='video').length;
    h += `<div class="section" style="display:flex;align-items:center;gap:8px">Médias (${media.length}) · survol d'une vidéo = aperçu, clic = plein écran${nAnim ? `<span style="flex:1"></span><button class="tbtn mini" id="animT" title="Faire jouer les GIF / WebP animés et les vidéos (sans le son) directement dans la galerie">${animOn ? '⏸ Animations : oui' : '▶ Animations : non'}</button>` : ''}</div><div class="gallery">` + shown.map(c => {
      const vid = catOf(c)==='video';
      const anim = animOn && isAnimated(c);
      const inner = c.cloud
        ? `<div class="ph" title="Dans iCloud : téléchargé seulement à l'ouverture">☁️</div>`
        : `<img class="thumb" data-src="${anim ? raw(c.path) : thumbUrl(c.path)}" data-raw="${raw(c.path)}" data-vid="${vid?1:''}" alt="">`;
      const tip = descText(c);
      return `<figure class="${st.sel.has(c.path) ? 'sel' : ''}" data-p="${esc(c.path)}" data-vid="${vid?1:''}" data-cloud="${c.cloud?1:''}" title="${esc((tip ? tip + '\n' : '') + c.path)}"><span class="selbox" data-sel="${esc(c.path)}" title="Sélectionner">✓</span>${inner}${vid?`<span class="play">▶</span><span class="badge">${WEBVIDEO_RE.test(c.name) ? 'vidéo' : 'vidéo ' + esc(extOf(c))}</span>`:''}${c.archive ? '<span class="badge arch" title="Stocké dans l\'archive miroir">🗄</span>' : ''}${isAnimated(c) && !vid ? '<span class="badge gifb">GIF</span>' : ''}<figcaption><span>${esc(c.desc && c.desc.series ? c.desc.series + ' · ' : '')}${esc(c.name)}</span><span>${fmtSize(c.size)}</span></figcaption></figure>`;
    }).join('') + '</div>';
    if (media.length > shown.length) h += `<button class="tbtn more-btn" id="moreMedia">Afficher ${Math.min(120, media.length-shown.length)} de plus (${media.length-shown.length} restants)</button>`;
  }
  // galerie des documents (aperçu de la 1re page)
  const docs = list.filter(c => catOf(c)==='doc');
  if (docs.length && st.type !== 'dir'){
    const shownD = docs.slice(0, st.docLimit || 60);
    h += `<div class="section">Documents (${docs.length}) · clic = lire ici, sans quitter le dossier</div><div class="gallery docs">` + shownD.map(c =>
      `<figure class="${st.sel.has(c.path) ? 'sel' : ''}" data-p="${esc(c.path)}" data-doc="1" title="${esc((descText(c) ? descText(c) + '\n' : '') + c.path)}"><span class="selbox" data-sel="${esc(c.path)}" title="Sélectionner">✓</span>${c.cloud ? `<div class="ph">☁️</div>` : `<img class="thumb" data-src="${thumbUrl(c.path)}" data-raw="" alt="">`}<span class="badge ext">${esc(extOf(c))}</span>${c.archive ? '<span class="badge arch">🗄</span>' : ''}<figcaption><span>${esc(c.desc && c.desc.title ? c.desc.title : c.name)}</span><span>${fmtSize(c.size)}</span></figcaption></figure>`).join('') + '</div>';
    if (docs.length > shownD.length) h += `<button class="tbtn more-btn" id="moreDocs">Afficher ${Math.min(60, docs.length-shownD.length)} de plus (${docs.length-shownD.length} restants)</button>`;
  }
  $('#dirMedia').innerHTML = h;
  // liste
  const shownList = list.slice(0, st.listLimit);
  $('#dirList').innerHTML = `<div class="section">Contenu</div><div class="list">` + (shownList.length ? shownList.map(c =>
    `<div class="item ${st.sel.has(c.path) ? 'sel' : ''}" data-p="${esc(c.path)}" data-media="${isViewable(c)?1:''}">${c.kind!=='dir' ? `<input type="checkbox" class="isel" data-sel="${esc(c.path)}" ${st.sel.has(c.path) ? 'checked' : ''} title="Sélectionner">` : '<span class="isel-sp"></span>'}<span class="ic">${iconFor(byId.get(c.path)||c)}</span><span class="nm">${c.archive ? '<span title="Archive miroir">🗄 </span>' : ''}${hlText(c.name, st.q)}${c.where!=null && (st.results!=null || st.info.kind==='tag' || c.archive) ? ` <small class="where">${esc((w => w === '.' ? '' : w)(c.archive && st.info.mirror ? relWhere(c.where, st.info.mirror.path) : relWhere(c.where, st.info.path)))}</small>` : ''}${c.snippet ? `<small class="snip">…${hlText(c.snippet, st.q)}…</small>` : ''}${descText(c) ? `<small class="snip">${esc(descText(c).slice(0, 220))}</small>` : ''}</span><span class="sz">${c.cloud?'☁️ ':''}${c.kind==='dir'?'':fmtSize(c.size)}</span></div>`).join('')
    : `<div class="empty">${st.info.children.length || (st.info.mirror && st.info.mirror.items.length) ? 'Aucun élément ne correspond aux filtres.' : (st.info.mirror && !st.withArchive ? 'Dossier vide : coche « Inclure l\'archive miroir » pour voir ses médias.' : 'Dossier vide')}</div>`) + '</div>'
    + (list.length > shownList.length ? `<button class="tbtn more-btn" id="moreList">Afficher la suite (${list.length-shownList.length})</button>` : '');
  wireDirView();
}

function descText(c){
  const d = c.desc; if (!d) return '';
  let host = ''; if (d.url){ try { host = '🔗 ' + new URL(d.url).hostname.replace(/^www\./, ''); } catch(e){} }
  const head = [d.title, d.series, d.silo, d.character, d.artist && ('par ' + d.artist), d.pages && (d.pages + ' p.'), host].filter(Boolean).join(' · ');
  return head + (d.description ? (head ? ' — ' : '') + d.description : '');
}
function selItems(){
  const st = dirState; if (!st) return [];
  const all = (st.results || []).concat(st.info.children, st.info.mirror ? st.info.mirror.items : []);
  const seen = new Set(); const out = [];
  all.forEach(c => { if (st.sel.has(c.path) && !seen.has(c.path)){ seen.add(c.path); out.push(c); } });
  return out;
}
function renderSelBar(){
  const st = dirState, bar = $('#selbar');
  if (!st || !st.sel.size){ bar.style.display = 'none'; $('#pbody').classList.remove('selecting'); return; }
  $('#pbody').classList.add('selecting');
  bar.style.display = '';
  bar.innerHTML = `<b>${st.sel.size}</b> sélectionné(s) <button class="tbtn mini" id="selAll">Tout (affichés)</button><button class="tbtn mini" id="selNone">Aucun</button><span class="sp"></span>
    <button class="tbtn" id="selMove" title="Choisir toi-même le dossier et le nom (instantané, sans IA)">✋ Déplacer / renommer…</button>
    <button class="tbtn primary" id="selHermes" title="Hermes analyse, renomme, range et met à jour les index">☤ Reclasser avec Hermes</button>`;
  $('#selAll').onclick = () => { filteredChildren().forEach(c => { if (c.kind!=='dir') st.sel.add(c.path); }); renderDirView(); };
  $('#selNone').onclick = () => { st.sel.clear(); renderDirView(); };
  $('#selMove').onclick = () => openMoveDialog(selItems());
  $('#selHermes').onclick = () => openReclassDialog(selItems());
}
function wireDirView(){
  const st = dirState;
  const toggleSel = (p, on) => { (on ?? !st.sel.has(p)) ? st.sel.add(p) : st.sel.delete(p);
    document.querySelectorAll(`[data-sel="${CSS.escape(p)}"]`).forEach(x => { const host = x.closest('figure, .item'); host && host.classList.toggle('sel', st.sel.has(p)); if (x.type === 'checkbox') x.checked = st.sel.has(p); });
    renderSelBar(); };
  document.querySelectorAll('#dirMedia .selbox').forEach(b => b.onclick = e => { e.stopPropagation(); toggleSel(b.dataset.sel); });
  document.querySelectorAll('#dirList .isel').forEach(b => b.onclick = e => { e.stopPropagation(); toggleSel(b.dataset.sel, b.checked); });
  renderSelBar();
  $('#animT') && ($('#animT').onclick = () => { animOn = !animOn; try { localStorage.setItem('hm-anim', animOn ? 'on' : 'off'); } catch(e){} renderDirView(); });
  $('#moreMedia') && ($('#moreMedia').onclick = () => { st.mediaLimit += 120; renderDirView(); });
  $('#moreDocs') && ($('#moreDocs').onclick = () => { st.docLimit = (st.docLimit || 60) + 60; renderDirView(); });
  $('#moreList') && ($('#moreList').onclick = () => { st.listLimit += 400; renderDirView(); });
  document.querySelectorAll('#dirList .item[data-p]').forEach(it => it.onclick = e => {
    if ((st.sel.size || e.metaKey || e.ctrlKey || e.shiftKey) && it.querySelector('.isel')){ toggleSel(it.dataset.p); return; }
    const p = it.dataset.p;
    if (it.dataset.media) return openMedia(p);
    const c = (st.results || st.info.children.concat(st.info.mirror ? st.info.mirror.items : [])).find(x => x.path === p);
    if (c && c.desc && c.desc.url && /\.(url|webloc)$/i.test(c.name)) return window.open(c.desc.url, '_blank', 'noopener');
    if (byId.has(p)) selectNode(p); else openPanel(p);
  });
  // miniatures chargées seulement quand elles deviennent visibles
  tileObserver && tileObserver.disconnect();
  tileObserver = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const img = en.target; tileObserver.unobserve(img);
    img.onerror = () => {
      img.onerror = null;
      if (img.closest('figure[data-doc]')){ const ph = document.createElement('div'); ph.className = 'ph doc'; ph.textContent = '📄'; img.replaceWith(ph); return; }
      if (img.dataset.vid){ // pas de miniature système : première image de la vidéo
        const v = document.createElement('video');
        v.className='thumb'; v.muted=true; v.preload='metadata'; v.src = img.dataset.raw + '#t=0.5';
        img.replaceWith(v);
      } else img.src = img.dataset.raw;
    };
    img.src = img.dataset.src;
  }), {root: $('#pbody'), rootMargin: '300px'});
  document.querySelectorAll('#dirMedia img.thumb[data-src]').forEach(img => tileObserver.observe(img));
  // vidéos : en boucle, sans le son, seulement quand elles sont à l'écran (bouton Animations)
  vidObserver && vidObserver.disconnect();
  vidObserver = new IntersectionObserver(entries => entries.forEach(en => {
    const f = en.target;
    if (en.isIntersecting){
      let v = f.querySelector('video.auto');
      if (!v){ v = document.createElement('video'); v.className = 'thumb auto'; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata'; v.src = raw(f.dataset.p); v.style.cssText = 'position:absolute;top:0;left:0'; f.prepend(v); f.classList.add('previewing'); v.onerror = () => { v.remove(); f.classList.remove('previewing'); }; }
      v.play().catch(()=>{});
    } else { const v = f.querySelector('video.auto'); if (v) v.pause(); }
  }), {root: $('#pbody'), rootMargin: '100px'});
  if (animOn) document.querySelectorAll('#dirMedia figure[data-vid="1"]:not([data-cloud="1"])').forEach(f => { if (WEBVIDEO_RE.test(f.dataset.p)) vidObserver.observe(f); });
  document.querySelectorAll('#dirMedia figure').forEach(f => {
    f.onclick = e => { if (st.sel.size || e.metaKey || e.ctrlKey || e.shiftKey){ toggleSel(f.dataset.p); return; } openMedia(f.dataset.p); };
    if (f.dataset.vid && !f.dataset.cloud && !(animOn && WEBVIDEO_RE.test(f.dataset.p))){
      if (!WEBVIDEO_RE.test(f.dataset.p)) return;
      let pv = null, timer = null;
      f.onmouseenter = () => { timer = setTimeout(() => {
        pv = document.createElement('video'); pv.className='thumb'; pv.muted=true; pv.loop=true; pv.autoplay=true; pv.playsInline=true;
        pv.src = raw(f.dataset.p); pv.style.cssText='position:absolute;top:0;left:0';
        f.prepend(pv); f.classList.add('previewing'); pv.play().catch(()=>{});
      }, 350); };
      f.onmouseleave = () => { clearTimeout(timer); if (pv){ pv.pause(); pv.removeAttribute('src'); pv.load(); pv.remove(); pv=null; } f.classList.remove('previewing'); };
    }
  });
}

function kindLabel(k, skill){
  if (skill) return 'Skill';
  return ({dir:'Dossier',markdown:'Markdown',json:'JSON',config:'Configuration',text:'Texte',image:'Image',pdf:'PDF',audio:'Audio',video:'Vidéo',db:'Base SQLite',secret:'Secrets',binary:'Binaire',icloud:'Non téléchargé (iCloud)',tag:'Tag',office:'Document Office'})[k] || k;
}

function splitFrontmatter(text){
  const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if (!m) return [null, text];
  const rows = [];
  m[1].split('\n').forEach(line => {
    const mm = line.match(/^([\w.\-]+)\s*:\s*(.*)$/);
    if (mm) rows.push([mm[1], mm[2]]); else if (rows.length && line.trim()) rows[rows.length-1][1] += ' ' + line.trim();
  });
  return [rows, text.slice(m[0].length)];
}

function renderMarkdown(text, basePath){
  const [fm, bodyText] = splitFrontmatter(text);
  let pre = bodyText.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, t, alias) =>
    `<span class="wl" data-wl="${esc(t.trim())}">${esc(alias||t)}</span>`);
  let html = DOMPurify.sanitize(marked.parse(pre, {gfm:true, breaks:false}), {ADD_ATTR:['data-wl']});
  const fmHtml = fm ? '<table class="fm">' + fm.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('') + '</table>' : '';
  return `${fmHtml}<div class="md" data-base="${esc(basePath||'')}">${html}</div>`;
}

function renderText(info){
  const k = info.kind, t = info.text, name = info.name.toLowerCase();
  if (k==='markdown') return renderMarkdown(t, info.path.split('/').slice(0,-1).join('/'));
  if (name.endsWith('.jsonl')) return renderJsonl(t);
  if (name.endsWith('.json')){
    try {
      const obj = JSON.parse(t);
      const msgs = findMessages(obj);
      if (msgs) return renderChat(msgs) + `<details class="jl"><summary>JSON brut</summary><pre class="code">${esc(JSON.stringify(obj,null,2))}</pre></details>`;
      return `<pre class="code">${esc(JSON.stringify(obj,null,2))}</pre>`;
    } catch(e){}
  }
  return `<pre class="code">${esc(t)}</pre>`;
}

function findMessages(obj){
  if (Array.isArray(obj) && obj.length && obj.every(m => m && typeof m==='object' && 'role' in m)) return obj;
  if (obj && typeof obj==='object') for (const key of ['messages','conversation','history','turns']) if (Array.isArray(obj[key]) && obj[key].length && obj[key][0] && 'role' in obj[key][0]) return obj[key];
  return null;
}
function msgText(c){
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(p => typeof p==='string' ? p : (p.text ?? p.content ?? (p.type ? `[${p.type}]` : JSON.stringify(p)))).join('\n');
  if (c && typeof c==='object') return c.text ?? JSON.stringify(c, null, 2);
  return String(c ?? '');
}
function renderChat(msgs){
  return '<div class="section">' + T('Conversation ({0} messages)', msgs.length) + '</div><div class="chat">' + msgs.map(m => {
    const role = (m.role||'?').toLowerCase();
    let txt = msgText(m.content);
    if (!txt && m.tool_calls) txt = '```json\n' + JSON.stringify(m.tool_calls, null, 2) + '\n```';
    const cls = role.startsWith('user') ? 'user' : role.startsWith('assist') ? 'assistant' : role==='tool' ? 'tool' : 'other';
    return `<div class="msg ${cls}"><div class="role">${esc(m.role)}${m.name?' · '+esc(m.name):''}</div><div class="md">${DOMPurify.sanitize(marked.parse(String(txt).slice(0,20000)))}</div></div>`;
  }).join('') + '</div>';
}
function renderJsonl(t){
  const lines = t.split('\n').filter(l => l.trim());
  const objs = [];
  for (const l of lines){ try { objs.push(JSON.parse(l)); } catch(e){ objs.push(l); } }
  const msgs = objs.filter(o => o && typeof o==='object' && 'role' in o);
  if (msgs.length && msgs.length >= objs.length*0.5) return renderChat(msgs);
  const nested = objs.map(o => o && typeof o==='object' && (o.message && o.message.role ? o.message : null)).filter(Boolean);
  if (nested.length && nested.length >= objs.length*0.5) return renderChat(nested);
  return `<div class="section">${objs.length} entrées</div>` + objs.slice(0,1500).map((o,i) => {
    const s = typeof o==='string' ? o : JSON.stringify(o);
    const sum = typeof o==='object' && o ? (o.timestamp||o.time||o.ts||o.type||o.event||'') + ' ' + s.slice(0,140) : s.slice(0,160);
    return `<details class="jl"><summary>#${i+1} ${esc(sum)}</summary><pre class="code">${esc(typeof o==='string'?o:JSON.stringify(o,null,2))}</pre></details>`;
  }).join('');
}

function renderRefs(id){
  if (!data) return '';
  const out = [], inn = [];
  data.links.forEach(l => {
    if (l.type!=='ref') return;
    const s = typeof l.source==='object'? l.source.id : l.source, t = typeof l.target==='object'? l.target.id : l.target;
    if (s===id) out.push([t,l.why]); else if (t===id) inn.push([s,l.why]);
  });
  const row = ([p,why]) => { const n = byId.get(p) || {name:p,kind:'text'};
    return `<div class="item" data-p="${esc(p)}"><span class="ic">${iconFor(n)}</span><span class="nm">${esc(n.name)} <small style="color:var(--muted);font-family:var(--mono)">${esc(p)}</small></span><span class="why">${esc(why)}</span></div>`; };
  let h = '';
  if (out.length) h += `<div class="section">Fait référence à (${out.length})</div><div class="list refs">${out.map(row).join('')}</div>`;
  if (inn.length) h += `<div class="section">Cité par (${inn.length})</div><div class="list refs">${inn.map(row).join('')}</div>`;
  return h;
}

function resolveRel(base, href){
  // lien absolu vers un fichier de la racine (convention des PDF d'archive) -> chemin relatif à la racine
  if (href.startsWith('/')){ const r = (data && data.root || '') + '/'; return href.startsWith(r) ? href.slice(r.length).replace(/\/$/, '') : null; }
  const parts = (base ? base.split('/') : []);
  href.split('/').forEach(seg => { if (seg==='..') parts.pop(); else if (seg && seg!=='.') parts.push(seg); });
  return parts.join('/');
}

function findByName(t){
  t = t.toLowerCase();
  for (const n of data.nodes) if (n.name.toLowerCase()===t || n.name.toLowerCase()===t+'.md') return n.id;
  for (const n of data.nodes) if (n.name.toLowerCase().replace(/\.\w+$/,'')===t) return n.id;
  return null;
}

function wirePanel(body, info){
  body.querySelectorAll('.list.refs .item[data-p]').forEach(it => it.onclick = () => {
    const p = it.dataset.p;
    if (byId.has(p)) selectNode(p); else openPanel(p);
  });
  body.querySelectorAll('.viewer img').forEach(f => f.onclick = () => { lbList = [{path: info.path, name: info.name, kind: info.kind}]; openLightbox(0); });
  body.querySelectorAll('.wl').forEach(w => w.onclick = () => { const id = findByName(w.dataset.wl); if (id) selectNode(id); else w.title='Introuvable dans le dossier'; });
  body.querySelectorAll('.md[data-base]').forEach(md => {
    const base = md.dataset.base;
    md.querySelectorAll('img').forEach(img => { const s = img.getAttribute('src')||''; if (!/^(https?:|data:)/.test(s)){ const t = resolveRel(base, decodeURIComponent(s)); if (t !== null) img.src = raw(t); } });
    md.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (/^(https?:|mailto:)/.test(h)){ a.target='_blank'; a.rel='noopener'; return; }
      if (h.startsWith('#')) return;
      const target = resolveRel(base, decodeURIComponent(h.split('#')[0]));
      if (target === null){ a.title = 'Hors des dossiers suivis : non consultable ici'; a.style.opacity = .6; a.onclick = e => e.preventDefault(); return; }
      a.onclick = e => { e.preventDefault(); const p = target.replace(/\/$/, ''); if (/\.(png|jpe?g|gif|webp|mp4|mov|webm|m4v|mp3|wav|m4a)$/i.test(p)){ lbList = [{path: p, name: p.split('/').pop(), kind: /\.(mp4|mov|webm|m4v)$/i.test(p) ? 'video' : /\.(mp3|wav|m4a)$/i.test(p) ? 'audio' : 'image'}]; return openLightbox(0); } byId.has(p) ? selectNode(p) : openPanel(p); };
    });
  });
  body.querySelectorAll('.tabs button[data-t]').forEach(b => b.onclick = () => {
    body.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    loadTable(info.path, b.dataset.t, 0);
  });
}

async function loadTable(path, table, offset){
  const v = $('#dbview'); v.className=''; v.innerHTML='<div class="empty">Chargement…</div>';
  const r = await (await fetch(`/api/db?path=${encodeURIComponent(path)}&table=${encodeURIComponent(table)}&offset=${offset}`)).json();
  if (r.error){ v.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  v.innerHTML = `<div class="dbtable"><table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    r.rows.map(row => `<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="tbtn" id="dbPrev" ${offset?'':'disabled'}>‹ Précédent</button><span class="chip">lignes ${offset+1}–${offset+r.rows.length}</span><button class="tbtn" id="dbNext" ${r.rows.length<100?'disabled':''}>Suivant ›</button></div>`;
  $('#dbPrev').onclick = () => loadTable(path, table, Math.max(0, offset-100));
  $('#dbNext').onclick = () => loadTable(path, table, offset+100);
}

// ---------------- Mise à jour avec Hermes ----------------
const HM_TOKEN = '__HM_TOKEN__';
let hjob = null, hpoll = null, hsince = 0, hesince = 0;
const hpost = async (url, body) => (await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-HM-Token':HM_TOKEN}, body: JSON.stringify(body)})).json();
const hshow = () => { $('#hmodal').style.display='flex'; };
const hhide = () => { $('#hmodal').style.display='none'; };
function hstateLabel(st){ return ({preparing:'sauvegarde…', running:'Hermes travaille…', done:'terminé', error:'erreur', stopped:'arrêté'})[st] || st; }

async function openHermes(){
  // une tâche en cours ? on réaffiche son suivi
  if (hjob && ['preparing','running'].includes(hjob.state)){ hshow(); return; }
  const path = panelPath || '';
  const info = await (await fetch('/api/hermes/info?path=' + encodeURIComponent(path))).json();
  hshow();
  $('#hstate').style.display='none';
  $('#htitle').textContent = 'Mettre à jour avec Hermes';
  if (info.disabled){ $('#hbody').innerHTML = `<div class="warn">Le bouton Hermes est désactivé (Hermes Map a été lancé avec --no-hermes).</div>`; $('#hfoot').innerHTML=''; return; }
  if (!info.available){
    $('#hbody').innerHTML = `<div class="warn">La commande <code>hermes</code> est introuvable pour Hermes Map.<br><br>Dans le Terminal, tape <code>which hermes</code>, puis relance Hermes Map avec :<br><code>python3 hermes_map.py --hermes /le/chemin/affiché</code></div>`;
    $('#hfoot').innerHTML=''; return;
  }
  const t = info.target;
  if (!t || !t.ok){ $('#hbody').innerHTML = `<div class="warn">${esc(t ? t.why : 'Ouvre un dossier ou une note.')}</div>`; $('#hfoot').innerHTML=`<span class="sp"></span><button class="tbtn" onclick="document.getElementById('hmodal').style.display='none'">Fermer</button>`; return; }
  const key = 'hm-prompt-' + t.kind + (HM_LANG === 'en' ? '-en' : '');
  const def = t.kind==='dir' ? info.prompt_dir : info.prompt_file;
  let tpl = def; try { tpl = localStorage.getItem(key) || def; } catch(e){}
  const fill = x => x.replaceAll('{nom}', t.name).replaceAll('{chemin}', t.abs).replaceAll('{dossier}', t.parent || '/');
  $('#hbody').innerHTML = `
    <div class="tgt">${t.kind==='dir'
      ? `Hermes va mettre à jour les notes <b>.md</b> du dossier <b>${esc(t.name)}</b> et de tous ses sous-dossiers (<b>${t.md_count}</b> note(s) .md).`
      : `Hermes va mettre à jour la note <b>${esc(t.name)}</b>.`}<br><code>${esc(t.abs)}</code></div>
    <div class="note">Consigne envoyée à Hermes (modifiable ; <code>{nom}</code>, <code>{chemin}</code> et <code>{dossier}</code> sont remplacés automatiquement). Ta version est retenue pour la prochaine fois.</div>
    <textarea id="hprompt" spellcheck="false"></textarea>
    <div class="note">🛟 Avant de commencer, Hermes Map sauvegarde tous les <b>.md</b> concernés. À la fin, tu verras la liste des fichiers modifiés et créés, le détail de chaque changement, et un bouton <b>Annuler</b> pour tout remettre comme avant.</div>
    <div style="display:flex;gap:10px;align-items:center"><b class="tgt">Profil Hermes</b><select id="hprof" class="mvin" style="width:auto">${['default'].concat(info.profiles || []).map(p => `<option ${p===guessProfile(t.path, info.profiles || []) ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select><span class="note">présélectionné d'après le vault (${esc(t.path.split('/')[0])})</span></div>
    ${t.kind==='dir' && t.md_count > 300 ? `<div class="warn">⚠️ ${t.md_count} notes : ce sera long et consommera beaucoup d'appels au modèle. Commencer par un sous-dossier est plus prudent.</div>` : ''}`;
  $('#hprompt').value = tpl;
  $('#hfoot').innerHTML = `<button class="tbtn" id="hreset">Consigne par défaut</button><span class="sp"></span><span class="note">Commande : <code>${esc(info.hermes)} -p &lt;profil&gt; chat --query-file -</code></span><button class="tbtn" id="hcancel">Annuler</button><button class="tbtn primary" id="hgo">☤ Lancer Hermes</button>`;
  $('#hreset').onclick = () => { $('#hprompt').value = def; try { localStorage.removeItem(key); } catch(e){} };
  $('#hcancel').onclick = hhide;
  $('#hgo').onclick = async () => {
    const tplNow = $('#hprompt').value;
    try { if (tplNow !== def) localStorage.setItem(key, tplNow); else localStorage.removeItem(key); } catch(e){}
    $('#hgo').disabled = true;
    const pr = $('#hprof') ? $('#hprof').value : 'default';

function guessProfile(path, profiles){
  const top = (path || '').split('/')[0], z = stripPrefix(top).toLowerCase();
  if (profiles.includes(z)) return z;
  if (CFG.archive_dir && top === CFG.archive_dir){ const w = (path.split('/')[1] || '').toLowerCase(); if (profiles.includes(w)) return w; }
  const d = (CFG.hermes || {}).profile;

async function hPoll(){

  catch(e){ hpoll = setTimeout(hPoll, 2000); return; }
  if (r.error){ return; }
  hjob = r; hsince = r.next; hesince = r.enext;
  if (r.events && r.events.length){ liveStart(); r.events.forEach(liveEvent); }

  const el = $('#htime'); if (el) el.textContent = T('Durée : {0}', fmtDur(((r.ended || Date.now()/1000) - r.started)));

// ---------------- Activité de Hermes en direct sur la carte ----------------
function visibleAnchor(rel){
  // le nœud lui-même s'il est sur la carte, sinon son dossier visible le plus proche
  let a = rel;
  const vis = id => { const n = byId.get(id); return n && !hiddenGroups.has(n.group) && (showFiles || n.kind==='dir' || n.kind==='root'); };
  while (a && !vis(a)) a = a.split('/').slice(0,-1).join('/');
  return a || '/';
}
function liveStart(){
  if (liveOn) return;
  liveOn = true; liveFeed = [];
  G && G.autoPauseRedraw(false);
  $('#live').style.display = '';
  renderFeed();
  clearInterval(liveTimer);
  liveTimer = setInterval(() => {            // estompe les pulsations et rafraîchit le fil
    const now = Date.now()/1000;
    for (const [id, a] of activity) if (now - a.t > ACT[a.kind].ttl) activity.delete(id);
    refreshStyles(); renderFeed();
  }, 1000);
}
function liveStop(){
  setTimeout(() => {
    liveOn = false; clearInterval(liveTimer); unpinAll();
    G && G.autoPauseRedraw(true);
    renderFeed(true);
  }, 8000);
}
function liveEvent(ev){
  const now = Date.now()/1000;
  // fichier créé : nœud provisoire sous son dossier (remplacé par le vrai à la relecture)
  if (ev.kind==='create' && !byId.has(ev.path)){
    const parent = ev.path.split('/').slice(0,-1).join('/') || '/';
    if (byId.has(parent)){
      const pn = byId.get(parent);
      const n = {id: ev.path, name: ev.path.split('/').pop(), kind: 'markdown', path: ev.path, group: pn.group === 'root' ? ev.path.split('/')[0] : pn.group, depth: (pn.depth||0)+1, live: true};
      const pg = G && G.graphData().nodes.find(x => x.id===parent);
      if (pg){ n.x = pg.x + (Math.random()-.5)*20; n.y = pg.y + (Math.random()-.5)*20; }
      data.nodes.push(n); data.links.push({source: parent, target: ev.path, type: 'tree'});
      indexData();
    }
  }
  const anchor = visibleAnchor(ev.path);
  activity.set(anchor, {kind: ev.kind, t: now, path: ev.path});
  // nouveaux liens écrits par Hermes : dessinés tout de suite, avec des particules
  let added = 0;
  const keys = new Set(data.links.map(lkey));
  const addLink = (a, b, type) => {
    if (!a || !b || a===b) return;
    if (keys.has(a+'>'+b) || keys.has(b+'>'+a)) return;
    data.links.push({source: a, target: b, type: 'live', live: type, born: now}); keys.add(a+'>'+b); added++;
  };
  (ev.links||[]).forEach(t => addLink(anchor, visibleAnchor(t), 'lien'));
  (ev.tags||[]).forEach(t => { if (byId.has('#tag:'+t)) addLink('#tag:'+t, anchor, 'tag'); });
  if (added || ev.kind==='create'){ pinAll(); indexData(); render(); }
  liveFeed.unshift({...ev, anchor, at: now, added});
  liveFeed = liveFeed.slice(0, 40);
  if (followCam && ev.kind !== 'read' && now - lastFollow > 2.5){ lastFollow = now; focusLive(anchor); }
  refreshStyles(); renderFeed();
}
// pendant que Hermes travaille, la carte ne bouge pas : on fige les positions (nouveaux liens = visuels seulement)
function pinAll(){
  data.nodes.forEach(n => { if (n.x !== undefined && n.fx === undefined){ n.fx = n.x; n.fy = n.y; n._pin = true; } });
  g3Nodes.forEach(o => { if (o.x !== undefined && o.fx === undefined){ o.fx = o.x; o.fy = o.y; o.fz = o.z; o._pin = true; } });
}
function unpinAll(){
  data.nodes.forEach(n => { if (n._pin){ delete n.fx; delete n.fy; delete n._pin; } });
  g3Nodes.forEach(o => { if (o._pin){ delete o.fx; delete o.fy; delete o.fz; delete o._pin; } });
}
function focusLive(id){
  if (mode==='3d') return focusNode(id);
  const gn = G && G.graphData().nodes.find(x => x.id===id);
  if (gn){ G.centerAt(gn.x, gn.y, 900); if (G.zoom() < 1.2) G.zoom(1.6, 900); }
}
const ago = t => { const d = Math.round(Date.now()/1000 - t); return d < 2 ? 'à l\'instant' : d < 60 ? `il y a ${d} s` : `il y a ${Math.round(d/60)} min`; };
function renderFeed(final){
  const el = $('#live'); if (!el) return;
  if (!liveOn && !final){ el.style.display='none'; return; }
  const st = hjob ? hjob.state : '';
  const counts = {read:0, write:0, create:0, move:0};
  const uniq = {read:new Set(), write:new Set(), create:new Set(), move:new Set()};
  liveFeed.forEach(e => uniq[e.kind].add(e.path));
  Object.keys(uniq).forEach(k => counts[k] = uniq[k].size);
  el.innerHTML = `<div class="lh"><span class="dot ${['preparing','running'].includes(st) ? 'on' : ''}"></span><b>Hermes</b> <span class="muted">${esc(hstateLabel(st))}</span>
      <label title="La carte suit le fichier en cours d'écriture"><input type="checkbox" id="lfollow" ${followCam?'checked':''}> Suivre</label>

    <div class="lc"><span style="color:${ACT.read.c}">👁 ${counts.read} lu(s)</span><span style="color:${ACT.write.c}">✏️ ${counts.write} écrit(s)</span><span style="color:${ACT.create.c}">✨ ${counts.create} créé(s)</span>${counts.move ? `<span style="color:${ACT.move.c}">📦 ${counts.move} déplacé(s)</span>` : ''}</div>
    <div class="lf">${liveFeed.slice(0, 9).map((e,i) => `<div class="li" data-i="${i}"><span>${ACT[e.kind].icon}</span><span class="ln" style="color:${ACT[e.kind].c}">${esc(e.path.split('/').pop())}</span>${e.added ? `<small>+${e.added} lien(s)</small>` : ''}<small class="t">${ago(e.at)}</small></div>`).join('') || '<div class="muted" style="padding:4px 2px">En attente de la première action…</div>'}</div>`;
  el.querySelectorAll('.li').forEach(d => d.onclick = () => { const e = liveFeed[+d.dataset.i]; byId.has(e.path) ? selectNode(e.path, true) : openPanel(e.path); });
  $('#lfollow').onchange = () => { followCam = $('#lfollow').checked; };

async function openReclassDialog(items){

  if (!items.length) return;
  if (hjob && ['preparing','running'].includes(hjob.state)){ hshow(); return; }
  const info = await (await fetch('/api/hermes/info')).json();
  hshow(); $('#hstate').style.display='none';
  $('#htitle').textContent = `Reclasser ${items.length} fichier(s) avec Hermes`;
  if (!info.available){ $('#hbody').innerHTML = `<div class="warn">La commande <code>hermes</code> est introuvable (voir l'option --hermes).</div>`; $('#hfoot').innerHTML = ''; return; }
  const profiles = ['default'].concat(info.profiles || []);
  const rp = info.reclass_profile && profiles.includes(info.reclass_profile) ? info.reclass_profile : 'default';
  let prof = rp; try { prof = localStorage.getItem('hm-profile-reclass') || rp; } catch(e){}
  if (!profiles.includes(prof)) prof = rp;
  const def = info.prompt_reclass;
  let tpl = def; try { tpl = localStorage.getItem('hm-prompt-reclass' + (HM_LANG === 'en' ? '-en' : '')) || def; } catch(e){}
